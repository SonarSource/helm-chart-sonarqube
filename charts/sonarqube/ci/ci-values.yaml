community:
  enabled: true

image:
  pullSecrets:
    - name: pullsecret
  repository: "sonarsource/sonarqube"
  tag: "26.7.0.124771-master-community"
monitoringPasscode: "test"

resources:
  limits:
    cpu: 800m
    memory: 6144M
    ephemeral-storage: 512000M
  requests:
    cpu: 200m
    memory: 2048M
    ephemeral-storage: 1536M

tests:
  resources:
    requests:
      cpu: 50m
      memory: 200M
      ephemeral-storage: 100M
    limits:
      cpu: 50m
      memory: 200M
      ephemeral-storage: 1000M

# gVisor only renders when an agent is enabled. The Agent Orchestrator and Hunter Agent images are
# not pullable from CI, so both run with replicaCount 0: they're on here purely to satisfy that
# dependency and exercise the gVisor RuntimeClass and its installer DaemonSet on the kind worker.
agentOrchestrator:
  enabled: true
  replicaCount: 0
  image:
    repository: "example.com/agent-orchestrator"
    tag: "0.0.0"
  storage:
    bucket: "ci"
  # This chart's CI install uses the embedded database (community.enabled), so there is no
  # jdbcOverwrite.jdbcUrl to derive CORE DB settings from - set every field explicitly instead.
  # replicaCount 0 means the pod is never scheduled, so passwordSecretName doesn't need to exist.
  coreDb:
    endpoint: "ci-db:5432"
    name: "ci"
    username: "ci"
    passwordSecretName: "ci-db-credentials"
    passwordSecretKey: "password"

hunterAgent:
  enabled: true
  replicaCount: 0
  image:
    repository: "example.com/hunter-agent"
    tag: "0.0.0"

gvisor:
  enabled: true
  installer:
    enabled: true
    tolerations: []
    annotations:
      sidecar.istio.io/inject: "false"
