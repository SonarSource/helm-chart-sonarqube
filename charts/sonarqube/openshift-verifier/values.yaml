# chart-verifier installs the chart once per ci/*-values.yaml, deep-merging this file over each of
# them. So this file only carries what OpenShift changes; edition, image and resources come from
# the ci file (ci-values.yaml: Community Build, agentic-values.yaml: Enterprise with the agentic
# components).
OpenShift:
  enabled: true
  route:
    enabled: true
  # Clusters without Kata have no sandboxing RuntimeClass. Run the agent runtimes on the default
  # runtime rather than leaving them Pending on a missing "kata" handler. gvisor.* is already
  # ignored on OpenShift.
  agentRuntimeClassName: ""

monitoringPasscode: "test"

# The agentic-values.yaml endpoints are namespace-qualified for the kind "test" namespace; the
# verifier installs into "sonarqube". Unused (hence harmless) for ci-values.yaml.
jdbcOverwrite:
  jdbcUrl: "jdbc:postgresql://external-postgres-postgresql.sonarqube.svc.cluster.local:5432/postgres"

agentOrchestrator:
  storage:
    endpoint: "http://s3.sonarqube.svc.cluster.local:9000"

vortexAnalysis:
  storage:
    endpoint: "http://s3.sonarqube.svc.cluster.local:9000"
