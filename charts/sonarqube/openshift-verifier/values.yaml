# chart-verifier installs the chart once per ci/*-values.yaml with this file over each of them, but
# the merge is shallow: every top-level key set here replaces the ci file's one wholesale. So this
# file only carries top-level keys the ci files don't set (edition, image, resources and the
# agentic components come from ci-values.yaml: Community Build, agentic-values.yaml: Enterprise).
OpenShift:
  enabled: true
  route:
    enabled: true
  # Clusters without Kata have no sandboxing RuntimeClass. Run the agent runtimes on the default
  # runtime rather than leaving them Pending on a missing "kata" handler. gvisor.* is already
  # ignored on OpenShift.
  agentRuntimeClassName: ""

monitoringPasscode: "test"
