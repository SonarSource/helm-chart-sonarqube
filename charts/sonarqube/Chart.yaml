apiVersion: v2
name: sonarqube
description: SonarQube is a self-managed, automatic code review tool that systematically helps you deliver clean code. As a core element of our Sonar solution, SonarQube integrates into your existing workflow and detects issues in your code to help you perform continuous code inspections of your projects. The tool analyses 30+ different programming languages and integrates into your CI pipeline and DevOps platform to ensure that your code meets high-quality standards.
type: application
version: 2026.5.0
appVersion: 2026.4.0
keywords:
  - coverage
  - security
  - code
  - quality
home: https://www.sonarqube.org/
icon: https://raw.githubusercontent.com/SonarSource/sonarqube-static-resources/master/helm/SonarQubeServerLogo.png
sources:
  - https://github.com/SonarSource/helm-chart-sonarqube/tree/master/charts/sonarqube
  - https://github.com/SonarSource/docker-sonarqube
  - https://github.com/SonarSource/sonarqube
kubeVersion: ">= 1.24.0-0"
dependencies:
  - name: keda
    version: 2.20.2
    repository: https://kedacore.github.io/charts
    condition: keda.enabled
maintainers:
  - name: carminevassallo
    email: carmine.vassallo@sonarsource.com
  - name: emma44-m
    email: emma.mansalier@sonarsource.com
  - name: hatem-amairi-sonarsource
    email: hatem.amairi@sonarsource.com
  - name: jimil09
    email: jimil.desai@sonarsource.com
  - name: julienlancelot
    email: julien.lancelot@sonarsource.com
  - name: lukasz-jarocki-sonarsource
    email: lukasz.jarocki@sonarsource.com
  - name: matteo-mara-sonarsource
    email: matteo.mara@sonarsource.com
  - name: navyatejaotturu-sonarsource
    email: navya.otturu@sonarsource.com
annotations:
  artifacthub.io/links: |
    - name: support
      url: https://community.sonarsource.com/
    - name: Chart Source
      url: https://github.com/SonarSource/helm-chart-sonarqube/tree/master/charts/sonarqube
  artifacthub.io/changes: |
    - kind: added
      description: "Set a default MCP pod securityContext (fsGroup: 0), a default HOME=/data, and an optional mcp.initContainers hook so the non-root MCP server can write to /data"
    - kind: changed
      description: "Upgrade Chart's version to 2026.5.0"
    - kind: removed
      description: "Remove the deprecated ingress-nginx.enabled/nginx.enabled bundled ingress-nginx controller subchart dependency; ingress.enabled remains supported for a self-managed controller, or use httproute (Gateway API)"
    - kind: added
      description: "Add optional gVisor (runsc) sandboxing for the agent runtimes"
    - kind: added
      description: "Add the SonarQube Agent Orchestrator, Hunter Agent and Remediation Agent via agentOrchestrator.enabled, hunterAgent.enabled and remediationAgent.enabled"
    - kind: added
      description: "Add agentOrchestrator.env/extraVolumes/extraVolumeMounts, and a FILESYSTEM/NFS backend for the shared agentic job storage via agentOrchestrator.storage.type and vortex.storage.filesystem.baseDir"
    - kind: added
      description: "Add autoscaling for the Agent Orchestrator (agentOrchestrator.autoscaling, a plain CPU/Memory HorizontalPodAutoscaler) and each agent runtime family (hunterAgent/remediationAgent.autoscaling, a KEDA ScaledObject; requires KEDA installed in-cluster, or agentKeda.assumeInstalled set explicitly), with terminationGracePeriodSeconds hardening so an in-flight job survives any scale-down, not just an autoscaler-driven one, and an autoscaling.manageReplicas opt-out for GitOps tooling (Argo CD, Flux) that applies helm template output directly"
    - kind: added
      description: "Add an optional KEDA operator subchart dependency (keda.enabled), so KEDA can be installed as part of this release instead of requiring a separate cluster-wide install before enabling hunterAgent/remediationAgent.autoscaling"
    - kind: added
      description: "Add hunterAgent/remediationAgent.storage (target + optional prefix) and a validation.yaml check on its extraVolumeMounts, so each agent runtime can be scoped to only its own subtree of a shared FILESYSTEM/NFS agentOrchestrator.storage.filesystem.baseDir via a per-runtime subPath mount"
    - kind: changed
      description: "Upgrade the bundled JMX Prometheus Exporter to 1.6.0; versions 1.1.0 and later use GitHub Releases, while earlier versions use Maven Central"
    - kind: added
      description: "Expose prometheusExporter.metricsPath at /metrics by default and add optional prometheusExporter.sha256 verification"
    - kind: changed
      description: "Breaking: built-in JVM metric names now use OpenMetrics naming; metrics generated from config.rules are unaffected"
    - kind: changed
      description: "Breaking: the bundled JMX Prometheus Exporter metrics endpoint is now /metrics instead of /; update external scrapers accordingly"
    - kind: changed
      description: "Default JMX Prometheus Exporter downloads use GitHub Releases and require network access to github.com and release-assets.githubusercontent.com"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: sonarqube-community
      image: sonarqube:26.7.0.124771-community
    - name: sonarqube-developer
      image: sonarqube:2026.4.0-developer
    - name: sonarqube-enterprise
      image: sonarqube:2026.4.0-enterprise
    - name: sonarqube-mcp
      image: sonarsource/sonarqube-mcp:1.22.0.3040
  charts.openshift.io/name: sonarqube
