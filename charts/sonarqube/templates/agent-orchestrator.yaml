{{- if .Values.agentOrchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sonarqube.agentOrchestrator.fullname" . }}
  labels:
    app: {{ template "sonarqube.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    sonarqube.agent/component: orchestrator
    app.kubernetes.io/component: agent-orchestrator
spec:
  {{- /* Omit replicas once the HPA owns it, except on install, so upgrades don't fight it.
         Release.IsInstall is also true under `helm template`, so GitOps tooling needs
         manageReplicas=false to opt out - which must only gate this branch, or a plain
         non-autoscaled install would wrongly drop replicas too. */}}
  {{- if or (not .Values.agentOrchestrator.autoscaling.enabled) (and .Release.IsInstall .Values.agentOrchestrator.autoscaling.manageReplicas) }}
  replicas: {{ .Values.agentOrchestrator.replicaCount }}
  {{- end }}
  {{- with .Values.agentOrchestrator.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  {{- with .Values.agentOrchestrator.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "sonarqube.agentOrchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/agent-orchestrator-secret.yaml") . | sha256sum }}
        {{- with .Values.agentOrchestrator.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with include "sonarqube.istio.sidecarInjectAnnotation" . }}
        {{- . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sonarqube.agentOrchestrator.selectorLabels" . | nindent 8 }}
        sonarqube.agent/component: orchestrator
        {{- with .Values.agentOrchestrator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with include "sonarqube.istio.sidecarInjectAnnotation" . }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      {{- /* Protects an in-flight graceful drain (server.shutdown: graceful) from the k8s default
             30s SIGKILLing it almost immediately - same rationale as agent-runtime.yaml. */}}
      terminationGracePeriodSeconds: {{ .Values.agentOrchestrator.terminationGracePeriodSeconds }}
      automountServiceAccountToken: {{ include "sonarqube.agent.automountServiceAccountToken" (dict "ctx" . "serviceAccount" .Values.agentOrchestrator.serviceAccount) }}
      {{- /* The wait-for-sonarqube init container below pulls the SonarQube image, so it needs the
             application nodes' pull secrets too - the orchestrator's own only cover its own image. */}}
      {{- $pullSecrets := include "sonarqube.agent.imagePullSecrets" (list (fromYaml (include "sonarqube.agent.sonarqubeImage" .)) .Values.agentOrchestrator.image) }}
      {{- if $pullSecrets }}
      imagePullSecrets: {{- $pullSecrets | nindent 8 }}
      {{- end }}
      {{- with (fromYaml (include "sonarqube.agent.containerSecurityContext" (dict "ctx" . "securityContext" .Values.agentOrchestrator.securityContext))) }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $oracleDriver := and .Values.jdbcOverwrite.oracleJdbcDriver .Values.jdbcOverwrite.oracleJdbcDriver.url }}
      initContainers:
        - name: wait-for-sonarqube
          image: {{ include "sonarqube.image" . }}
          imagePullPolicy: {{ (fromYaml (include "sonarqube.agent.sonarqubeImage" .)).pullPolicy }}
          {{- with (fromYaml (include "sonarqube.agent.initContainerSecurityContext" .)) }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              until curl -sf "{{ include "sonarqube.agent.sonarqube.url" . }}/api/system/status" | grep -q '"status":"UP"'; do
                echo "Waiting for SonarQube to be UP..."; sleep 10;
              done
        {{- /* Same driver download as the SonarQube pod's install-oracle-jdbc-driver init container,
               reusing its ConfigMap script: the script writes to
               <sonarqubeFolder>/extensions/jdbc-driver/oracle, where this pod mounts the
               oracle-jdbc-driver emptyDir the orchestrator then reads the JAR from. The CA bundle
               the script's curl --cacert expects is built here from caCerts, as the SonarQube
               pod's ca-certs init container does. */}}
        {{- if $oracleDriver }}
        - name: install-oracle-jdbc-driver
          image: {{ default (include "sonarqube.image" .) .Values.initContainers.image }}
          imagePullPolicy: {{ (fromYaml (include "sonarqube.agent.sonarqubeImage" .)).pullPolicy }}
          {{- with (fromYaml (include "sonarqube.agent.initContainerSecurityContext" .)) }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.initContainers.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -e
            - -c
            - |
              {{- if .Values.caCerts.enabled }}
              : > /tmp/certs/ca-bundle.pem
              if [ "$(ls /tmp/secrets/ca-certs)" ]; then
                for f in /tmp/secrets/ca-certs/*; do cat "$f"; echo; done > /tmp/certs/ca-bundle.pem
              fi
              {{- end }}
              sh -e /tmp/scripts/install_oracle_jdbc_driver.sh
          volumeMounts:
            - name: oracle-jdbc-driver
              mountPath: {{ .Values.sonarqubeFolder }}/extensions/jdbc-driver/oracle
            - name: install-oracle-jdbc-driver
              mountPath: /tmp/scripts/
            {{- if .Values.jdbcOverwrite.oracleJdbcDriver.netrcCreds }}
            - name: oracle-jdbc-driver-netrc-file
              mountPath: /root
            {{- end }}
            {{- if .Values.caCerts.enabled }}
            - name: ca-certs
              mountPath: /tmp/secrets/ca-certs
            - name: ca-bundle
              mountPath: /tmp/certs
            {{- end }}
          env:
          {{- (include "sonarqube.combined_env" . | fromJsonArray) | toYaml | trim | nindent 12 }}
        {{- end }}
      containers:
        - name: agent-orchestrator
          image: "{{ .Values.agentOrchestrator.image.repository }}:{{ .Values.agentOrchestrator.image.tag }}"
          imagePullPolicy: {{ .Values.agentOrchestrator.image.pullPolicy }}
          {{- $orchestratorSecurityContext := .Values.agentOrchestrator.containerSecurityContext | default dict }}
          {{- with (fromYaml (include "sonarqube.agent.containerSecurityContext" (dict "ctx" . "securityContext" $orchestratorSecurityContext))) }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.agentOrchestrator.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.agentOrchestrator.port | quote }}
            {{- if .Values.agentOrchestrator.scheduler.enabled }}
            - name: SONAR_AGENTIC_ORCHESTRATOR_SCHEDULER_ENABLED
              value: "true"
            {{- end }}
            {{- /* When the chart-wide encryption key secret (.Values.sonarSecretKey) is set, mount
                   it into the orchestrator too, mirroring how it's mounted into the SonarQube
                   application pod and exposed there via the sonar.secretKeyPath property.
                   /sonarcloud is the orchestrator's own image path convention, independent of
                   .Values.sonarqubeFolder (which only applies to the SonarQube app image). */}}
            {{- if .Values.sonarSecretKey }}
            - name: AGENTIC_SECRET_KEY_PATH
              value: "/sonarcloud/secret/sonar-secret.txt"
            {{- end }}
            {{- /* One variable per HKDF-derived key file the orchestrator mounts - the key it
                   signs hunter's work with, the one it signs remediation's with, and
                   AGENTIC_SONARQUBE_SIGNING_KEY_PATH for the agentic-shared key it shares with
                   SQS/Vortex. See sonarqube.agentic.keyPathEnv. */}}
            {{- with (include "sonarqube.agentic.keyPathEnv" (dict "ctx" . "consumer" "orchestrator") | fromYamlArray) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- /* CORE DB (SonarQube's database) connection for the orchestrator. Each field is
                   independently configurable via agentOrchestrator.coreDb, defaulting to
                   the shared jdbcOverwrite so it targets the same DB as SonarQube out of the box.
                   Decoupling matters for the password: SonarQube may store an encrypted `{aes-gcm}`
                   value the orchestrator can't decrypt, or a chart-managed secret your GitOps
                   doesn't apply — point coreDb.passwordSecret{Name,Key} at a usable secret. The
                   sonarSecretKey mounted above (AGENTIC_SECRET_KEY_PATH) is unrelated to this: it
                   does not let the orchestrator decrypt an `{aes-gcm}` CORE_DB_PASSWORD. */}}
            {{- $coreDb := .Values.agentOrchestrator.coreDb }}
            {{- $coreDbUrl := include "sonarqube.agent.jdbc.url" . }}
            - name: CORE_DB_JDBC_URL
              value: {{ $coreDbUrl | quote }}
            {{- /* Orchestrator images before multi-database support only read this
                   PostgreSQL-only pair; newer ones prefer CORE_DB_JDBC_URL above. */}}
            {{- if hasPrefix "jdbc:postgresql:" $coreDbUrl }}
            {{- with include "sonarqube.agent.jdbc.endpoint" $coreDbUrl }}
            - name: CORE_DB_READ_WRITE_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with include "sonarqube.agent.jdbc.dbname" $coreDbUrl }}
            - name: CORE_DB_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if $oracleDriver }}
            - name: CORE_DB_ORACLE_DRIVER_DIR
              value: /app/jdbc-driver/oracle
            {{- end }}
            - name: CORE_DB_USERNAME
              {{- if $coreDb.username }}
              value: {{ $coreDb.username | quote }}
              {{- else }}
              value: {{ template "jdbc.username" . }}
              {{- end }}
            - name: CORE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $coreDb.passwordSecretName | default (include "jdbc.secret" .) }}
                  key: {{ $coreDb.passwordSecretKey | default (include "jdbc.secretPasswordKey" .) }}
            - name: AGENTIC_STORAGE_ENDPOINT
              value: {{ .Values.agentOrchestrator.storage.endpoint | quote }}
            - name: AGENTIC_STORAGE_REGION
              value: {{ .Values.agentOrchestrator.storage.region | quote }}
            - name: AGENTIC_STORAGE_BUCKET
              value: {{ .Values.agentOrchestrator.storage.bucket | quote }}
            - name: AGENTIC_STORAGE_PATH_STYLE
              value: {{ .Values.agentOrchestrator.storage.pathStyle | quote }}
            {{- /* type/filesystem.baseDir have no equivalent short AGENTIC_STORAGE_* var: the
                   orchestrator's own StoragePropertiesParser reads them straight off its
                   sonar.agentic.orchestrator.storage.* namespace, which these long, SONAR_-prefixed
                   names satisfy via Spring's relaxed env-var binding - unlike the vars above, which
                   are bound through an explicit ${AGENTIC_STORAGE_*} placeholder in its own
                   application.yml. */}}
            - name: SONAR_AGENTIC_ORCHESTRATOR_STORAGE_TYPE
              value: {{ .Values.agentOrchestrator.storage.type | quote }}
            - name: SONAR_AGENTIC_ORCHESTRATOR_STORAGE_FILESYSTEM_BASE_DIR
              value: {{ .Values.agentOrchestrator.storage.filesystem.baseDir | quote }}
            {{- /* Inject static storage keys only when provided (inline or via existingSecret). When
                   none are set, the env vars are omitted so the orchestrator's AWS SDK falls back to
                   its default credential chain - i.e. the pod's IAM identity (node instance role or
                   IRSA) for credential-less access to a real S3 bucket. */}}
            {{- if or .Values.agentOrchestrator.storage.accessKey .Values.agentOrchestrator.storage.secretKey .Values.agentOrchestrator.storage.existingSecret }}
            - name: AGENTIC_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "sonarqube.agentOrchestrator.fullname" .) .Values.agentOrchestrator.storage.existingSecret }}
                  key: AGENTIC_STORAGE_ACCESS_KEY
            - name: AGENTIC_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "sonarqube.agentOrchestrator.fullname" .) .Values.agentOrchestrator.storage.existingSecret }}
                  key: AGENTIC_STORAGE_SECRET_KEY
            {{- end }}
            - name: AGENTIC_SONARQUBE_URL
              value: {{ include "sonarqube.agent.sonarqube.url" . | quote }}
            {{- range $family, $cfg := fromYaml (include "sonarqube.agentRuntimes" .) }}
            {{- if $cfg.enabled }}
            - name: AGENTIC_{{ $family | upper }}_RUNTIME_PUSH_URL
              value: {{ include "sonarqube.agentRuntime.pushUrl" (dict "ctx" $ "family" $family) | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.agentOrchestrator.github.apiBaseUrl }}
            - name: AGENTIC_GITHUB_API_BASE_URL
              value: {{ .Values.agentOrchestrator.github.apiBaseUrl | quote }}
            {{- end }}
            {{- /* No AGENTIC_GITHUB_TOKEN: since SONAR-30903 the orchestrator obtains a short-lived
                   GitHub App installation token from SonarQube on demand via AGENTIC_SONARQUBE_URL,
                   authenticating with the derived agentic signing key rather than a static token. */}}
            {{- with .Values.agentOrchestrator.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.agentOrchestrator.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $keyMount := include "sonarqube.agentic.keyVolumeMount" (dict "ctx" . "consumer" "orchestrator" "mountPath" (include "sonarqube.agentic.keyDir" .)) }}
          {{- if or $orchestratorSecurityContext.readOnlyRootFilesystem .Values.sonarSecretKey $keyMount $oracleDriver .Values.agentOrchestrator.extraVolumeMounts }}
          volumeMounts:
            {{- if $orchestratorSecurityContext.readOnlyRootFilesystem }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if .Values.sonarSecretKey }}
            - name: secret
              mountPath: /sonarcloud/secret/
            {{- end }}
            {{- with $keyMount }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            {{- if $oracleDriver }}
            - name: oracle-jdbc-driver
              mountPath: /app/jdbc-driver/oracle
              readOnly: true
            {{- end }}
            {{- with .Values.agentOrchestrator.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with (include "sonarqube.agent.probe" (dict "probe" .Values.agentOrchestrator.probes.readiness)) }}
          readinessProbe:
{{ . | indent 12 }}
          {{- end }}
          {{- with (include "sonarqube.agent.probe" (dict "probe" .Values.agentOrchestrator.probes.liveness)) }}
          livenessProbe:
{{ . | indent 12 }}
          {{- end }}
      {{- with (include "sonarqube.agent.scheduling" (dict "ctx" . "component" .Values.agentOrchestrator)) }}
{{ . | indent 6 }}
      {{- end }}
      serviceAccountName: {{ include "sonarqube.agentOrchestrator.serviceAccountName" . }}
      {{- $keyVolume := include "sonarqube.agentic.keyVolume" (dict "ctx" . "consumer" "orchestrator") }}
      {{- if or $orchestratorSecurityContext.readOnlyRootFilesystem .Values.sonarSecretKey $keyVolume $oracleDriver .Values.agentOrchestrator.extraVolumes }}
      volumes:
        {{- if $orchestratorSecurityContext.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if .Values.sonarSecretKey }}
        - name: secret
          secret:
            secretName: {{ .Values.sonarSecretKey }}
            items:
            - key: sonar-secret.txt
              path: sonar-secret.txt
        {{- end }}
        {{- with $keyVolume }}
        {{- . | trim | nindent 8 }}
        {{- end }}
        {{- if $oracleDriver }}
        - name: oracle-jdbc-driver
          emptyDir: {}
        - name: install-oracle-jdbc-driver
          configMap:
            name: {{ include "sonarqube.fullname" . }}-install-oracle-jdbc-driver
            items:
              - key: install_oracle_jdbc_driver.sh
                path: install_oracle_jdbc_driver.sh
        {{- if .Values.jdbcOverwrite.oracleJdbcDriver.netrcCreds }}
        - name: oracle-jdbc-driver-netrc-file
          secret:
            secretName: {{ .Values.jdbcOverwrite.oracleJdbcDriver.netrcCreds }}
            items:
              - key: netrc
                path: .netrc
        {{- end }}
        {{- if .Values.caCerts.enabled }}
        {{- include "sonarqube.volumes.caCerts" . | nindent 8 }}
        - name: ca-bundle
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- with .Values.agentOrchestrator.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
