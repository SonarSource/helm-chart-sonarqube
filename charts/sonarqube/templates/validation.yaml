{{/*
This file is for validating the values.yaml file.
It is used to validate the values.yaml file before the installation starts.
*/}}
{{- define "sonarqube.fail" -}}
{{- printf "\n ** The values.yaml file is not valid. ** \n %s\n" . | fail -}}
{{- end -}}

{{/*
* Validates the monitoring passcode logic.
*/}}
{{- if or (and (not .Values.monitoringPasscode) (not .Values.monitoringPasscodeSecretName) (not .Values.monitoringPasscodeSecretKey)) (and (not .Values.monitoringPasscodeSecretName) .Values.monitoringPasscodeSecretKey) (and .Values.monitoringPasscodeSecretName (not .Values.monitoringPasscodeSecretKey)) -}}
{{- include "sonarqube.fail" "Please provide a passcode either setting \"monitoringPasscode\" or \"monitoringPasscodeSecretName\" and \"monitoringPasscodeSecretKey\"" -}}
{{- end -}}

{{/*
* Validates the community.enabled, edition, and tag logic.
*/}}
{{- if eq .Values.edition "community" -}}
    {{- include "sonarqube.fail" "'community' is not a valid edition. If you want to use SonarQube Community Build, unset 'edition' and set 'community.enabled=true' instead." -}}
{{- else if and (.Values.community.enabled) (not (empty .Values.edition)) -}}
    {{- include "sonarqube.fail" "You can't set 'community.enabled=true' and an 'edition' at the same time." -}}
{{- else if not .Values.community.enabled -}}
    {{- if empty .Values.edition -}}
        {{- include "sonarqube.fail" "You must choose an 'edition' to install: 'developer' or 'enterprise'. If you want to use SonarQube Community Build, unset 'edition' and set 'community.enabled=true' instead." -}}
    {{- else if not (has .Values.edition (list "developer" "enterprise")) -}}
        {{- include "sonarqube.fail" "The 'edition' must be either 'developer' or 'enterprise'." -}}
    {{- end -}}
{{- end -}}

{{/* Validation for the Agent Orchestrator, when enabled */}}
{{- if .Values.agentOrchestrator.enabled -}}
  {{- if not .Values.agentOrchestrator.image.repository -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but agentOrchestrator.image.repository is not set." -}}
  {{- end -}}
  {{- $agentOrchestratorStorage := .Values.agentOrchestrator.storage -}}
  {{- /* bucket is meaningless for a file-based backend (FILESYSTEM, NFS): those hand the runtime a
         direct file:// path instead of a presigned URL, per StorageProvider's own semantics - they
         need filesystem.baseDir instead. Stay strict either way - an unset bucket must not silently
         fall back to StoragePropertiesParser's "agentic-jobs" placeholder, and an unset baseDir must
         not silently fall back to its per-service default directory (breaking the shared mount the
         orchestrator and runtimes rely on). */}}
  {{- if has $agentOrchestratorStorage.type (list "FILESYSTEM" "NFS") -}}
    {{- if not $agentOrchestratorStorage.filesystem.baseDir -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.storage.type is FILESYSTEM/NFS but agentOrchestrator.storage.filesystem.baseDir is not set." -}}
    {{- end -}}
  {{- else if not $agentOrchestratorStorage.bucket -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but agentOrchestrator.storage.bucket is not set." -}}
  {{- end -}}
  {{- if and (not $agentOrchestratorStorage.existingSecret) (or $agentOrchestratorStorage.accessKey $agentOrchestratorStorage.secretKey) (not (and $agentOrchestratorStorage.accessKey $agentOrchestratorStorage.secretKey)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but only one of agentOrchestrator.storage.accessKey / agentOrchestrator.storage.secretKey is set. Provide both, or neither for credential-less access." -}}
  {{- end -}}
  {{/* The orchestrator reads and writes SonarQube's own database, so it needs a real external
       one. The embedded database that jdbcOverwrite.enabled=false selects is not reachable from
       another pod, and every CORE_DB_* default below derives from jdbcOverwrite - so require it
       outright rather than letting agentOrchestrator.coreDb stand in for it. This gate does not
       exist in sonarqube-dce, which is always on an external database. */}}
  {{- if and (not .Values.jdbcOverwrite.enabled) (not .Values.jdbcOverwrite.enable) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but jdbcOverwrite is not enabled. The orchestrator shares SonarQube's database and cannot use the embedded one - set jdbcOverwrite.enabled=true and point it at an external PostgreSQL." -}}
  {{- end -}}
  {{- if and (not .Values.agentOrchestrator.coreDb.endpoint) (not (include "sonarqube.agent.jdbc.endpoint" .)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but the CORE DB endpoint could not be derived from jdbcOverwrite.jdbcUrl and agentOrchestrator.coreDb.endpoint is not set." -}}
  {{- end -}}
  {{- if and (not .Values.agentOrchestrator.coreDb.name) (not (include "sonarqube.agent.jdbc.dbname" .)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but the CORE DB name could not be derived from jdbcOverwrite.jdbcUrl and agentOrchestrator.coreDb.name is not set." -}}
  {{- end -}}
{{- end -}}

{{/* Validation for hunterAgent/remediationAgent dependencies, when enabled */}}
{{- if .Values.hunterAgent.enabled -}}
  {{- if not .Values.agentOrchestrator.enabled -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n hunterAgent.enabled is true but agentOrchestrator.enabled is not true." -}}
  {{- end -}}
{{- end -}}
{{- if .Values.remediationAgent.enabled -}}
  {{- if not .Values.agentOrchestrator.enabled -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n remediationAgent.enabled is true but agentOrchestrator.enabled is not true." -}}
  {{- end -}}
  {{- if not .Values.vortex.enabled -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n remediationAgent.enabled is true but vortex.enabled is not true." -}}
  {{- end -}}
{{- end -}}

{{/* Validation for Vortex, when enabled */}}
{{- if .Values.vortex.enabled -}}
  {{- if not .Values.vortex.image.repository -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortex.enabled is true but vortex.image.repository is not set." -}}
  {{- end -}}
  {{- if not .Values.vortex.image.tag -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortex.enabled is true but vortex.image.tag is not set." -}}
  {{- end -}}
  {{- $token := .Values.vortex.sonarqubeToken -}}
  {{- if and (not $token.token) (not $token.existingSecret) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortex.enabled is true but no token is set. You must provide either vortex.sonarqubeToken.token or vortex.sonarqubeToken.existingSecret." -}}
  {{- end -}}
  {{- $storage := .Values.vortex.storage -}}
  {{- if not $storage.type -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortex.enabled is true but vortex.storage.type is not set." -}}
  {{- end -}}
  {{- /* bucket/region are meaningless for a file-based backend (FILESYSTEM, NFS) - see the
         matching comment on agentOrchestrator.storage above. */}}
  {{- if has $storage.type (list "FILESYSTEM" "NFS") -}}
    {{- if not $storage.filesystem.baseDir -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortex.storage.type is FILESYSTEM/NFS but vortex.storage.filesystem.baseDir is not set." -}}
    {{- end -}}
  {{- else -}}
    {{- if not $storage.bucket -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortex.enabled is true but vortex.storage.bucket is not set." -}}
    {{- end -}}
    {{- if not $storage.region -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortex.enabled is true but vortex.storage.region is not set." -}}
    {{- end -}}
  {{- end -}}
  {{- if and (not $storage.existingSecret) (or $storage.accessKey $storage.secretKey) (not (and $storage.accessKey $storage.secretKey)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortex.enabled is true but only one of vortex.storage.accessKey / vortex.storage.secretKey is set. Provide both, or neither for credential-less access." -}}
  {{- end -}}
{{- end -}}

{{/* Validation for the agentic signing secret: fail closed if any agentic component that needs
     derived signing/verification keys (hunterAgent/remediationAgent/vortex) is enabled without an
     instance secret for the key-derivation hook Job to derive them from. */}}
{{- if eq (include "sonarqube.agentic.enabled" .) "true" -}}
  {{- if or (not .Values.agenticSigningSecret) (not .Values.agenticSigningSecret.existingSecret) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n One of hunterAgent.enabled / remediationAgent.enabled / vortex.enabled is true but agenticSigningSecret.existingSecret is not set. Provide the name of an existing Secret holding the operator-provided agentic instance secret." -}}
  {{- end -}}
  {{/* The hook Job runs derive-keys.sh, which only exists inside the Agent Orchestrator image
       (baked in there so air-gapped installs don't need a second image pull, per EA-791/ADR-10).
       vortex.enabled alone needs derived keys without otherwise deploying the orchestrator, hence
       agentKeyDerivation.image as an override rather than a hard read of agentOrchestrator.image. */}}
  {{- if and .Values.agentKeyDerivation.enabled (not (include "sonarqube.agentKeyDerivation.imageRepository" .)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n The agentic key-derivation hook Job needs an image carrying derive-keys.sh. Set agentOrchestrator.image.repository, or agentKeyDerivation.image.repository when the orchestrator isn't part of this install, or set agentKeyDerivation.enabled=false and provide the <fullname>-agentic-keys-* Secrets yourself." -}}
  {{- end -}}
{{- end -}}

{{/* Validation for the gVisor toggles (gvisor.*). The sub-options are only checked
     when gVisor is enabled: with gvisor.enabled=false the whole feature renders nothing, so a
     leftover installer.enabled (e.g. a base values file overlaid by one that disables gVisor) is
     inert and must not fail the install. */}}
{{- $gvisor := .Values.gvisor -}}
{{- if eq (include "sonarqube.gvisor.enabled" .) "true" -}}
  {{- if not $gvisor.runtimeClassName -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n gvisor.enabled=true requires a non-empty gvisor.runtimeClassName." -}}
  {{- end -}}
  {{- if not $gvisor.handler -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n gvisor.enabled=true requires a non-empty gvisor.handler (the containerd runtime handler)." -}}
  {{- end -}}
  {{- if and $gvisor.installer.enabled (not $gvisor.installer.image.repository) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n gvisor.installer.enabled=true requires a non-empty gvisor.installer.image.repository." -}}
  {{- end -}}
  {{/* The RuntimeClass merges gvisor.nodeSelector into each runtime pod's own nodeSelector; a
       shared key with different values makes the pod unschedulable at admission. */}}
  {{- range $family, $cfg := fromYaml (include "sonarqube.agentRuntimes" $) -}}
    {{- if $cfg.enabled -}}
      {{- $effective := default $.Values.nodeSelector $cfg.nodeSelector -}}
      {{- range $key, $val := $gvisor.nodeSelector -}}
        {{/* toString both sides: a non-string label value would otherwise make ne fail with a raw
             Go template type error instead of a readable message. */}}
        {{- if and (hasKey $effective $key) (ne (toString (index $effective $key)) (toString $val)) -}}
{{- fail (printf "\n ** The values.yaml file is not valid. ** \n %sAgent's effective nodeSelector conflicts with gvisor.nodeSelector on key %q (%q vs %q)." $family $key (toString (index $effective $key)) (toString $val)) -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
