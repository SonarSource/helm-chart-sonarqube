{{- if .Values.ingress.enabled -}}
{{- $serviceName := include "sonarqube.fullname" . -}}
{{- $servicePort := .Values.service.externalPort -}}
{{- $webContext := include "sonarqube.webcontext" . -}}
{{- $mcpOAuthDiscovery := ne $webContext "/" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "sonarqube.fullname" . }}
  labels:
    {{- include "sonarqube.labels" . | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ printf "%s" .name }}
    http:
      paths:
      - backend:
          service:
            name: {{ default $serviceName .serviceName }}
            port:
              number: {{ default $servicePort .servicePort }}
        path: {{ .path | default (include "sonarqube.webcontext" $) }}
        pathType: {{ default "ImplementationSpecific" .pathType }}
      {{- if and $mcpOAuthDiscovery (not (has .path (list "/" "/*"))) }}
      {{- /* MCP OAuth clients fetch the authorization server metadata at the host root (RFC 8414) */}}
      - backend:
          service:
            name: {{ default $serviceName .serviceName }}
            port:
              number: {{ default $servicePort .servicePort }}
        path: /.well-known/oauth-authorization-server{{ trimSuffix "/" $webContext }}
        {{- /* ingress-nginx 1.12+ rejects "." in Prefix and Exact paths */}}
        pathType: ImplementationSpecific
      {{- end }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end -}}
{{- end }}
