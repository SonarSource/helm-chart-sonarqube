{{- $storage := .Values.vortexAnalysis.storage }}
{{- $inlineStorage := and (not $storage.existingSecret) (or $storage.accessKey $storage.secretKey) }}
{{- if and .Values.vortexAnalysis.enabled $inlineStorage }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sonarqube.vortex.fullname" . }}
  labels: {{- include "sonarqube.labels" . | nindent 4 }}
    app.kubernetes.io/component: vortex
type: Opaque
data:
  SONAR_AGENTIC_STORAGE_ACCESS_KEY: {{ $storage.accessKey | b64enc | quote }}
  SONAR_AGENTIC_STORAGE_SECRET_KEY: {{ $storage.secretKey | b64enc | quote }}
{{- end }}
