{{- if and .Values.vortexAnalysis.enabled .Values.vortexAnalysis.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sonarqube.vortex.fullname" . }}
  labels: {{- include "sonarqube.labels" . | nindent 4 }}
    app.kubernetes.io/component: vortex
spec:
  scaleTargetRef:
    name: {{ include "sonarqube.vortex.fullname" . }}
  minReplicaCount: {{ .Values.vortexAnalysis.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.vortexAnalysis.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.vortexAnalysis.autoscaling.pollingInterval }}
  {{- /* A total scrape failure (unlike the partial-failure case aggregateFromKubeServiceEndpoints
         absorbs) otherwise leaves the HPA with no metric and no signal anything is wrong. Holds
         what is already running (raised only to the minReplicas floor if lower), not maxReplicas:
         an ordinary misconfiguration (a bad metricPath, every replica unready) is enough to hit
         failureThreshold, and jumping to the ceiling would schedule maxReplicas pods of a broken
         service and hold them there for scaleDownStabilizationSeconds after it recovers. On KEDA
         < 2.17 `behavior` is pruned by the CRD and this degrades to a static minReplicas. */}}
  fallback:
    failureThreshold: 3
    behavior: currentReplicasIfHigher
    replicas: {{ .Values.vortexAnalysis.autoscaling.minReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      {{- /* KEDA otherwise derives the HPA name as "keda-hpa-<scaledobject name>", whose 9-char
             prefix can push it past the 63-char name limit even though the ScaledObject name
             itself fits. Reuse the (already-truncated) ScaledObject name directly instead. */}}
      name: {{ include "sonarqube.vortex.fullname" . }}
      behavior:
        scaleDown:
          {{- /* Cloud's own scale-in cooldown, and the guard against KEDA's partial-endpoint-failure
                 under-report: a replica whose poll fails is silently dropped from the sum rather than
                 surfaced as an error, so a handful of failed polls must not trigger a fast scale-down. */}}
          stabilizationWindowSeconds: {{ .Values.vortexAnalysis.autoscaling.scaleDownStabilizationSeconds }}
  triggers:
    {{- /* Reads Vortex's own unauthenticated GET <metricPath> (peak concurrent requests over a
           sliding window). Unlike the agent runtimes' shared orchestrator queue, Vortex has no
           shared metric - each replica only knows its own peak - so the value has to be aggregated
           across replicas by KEDA itself. No authenticationRef: the endpoint is unauthenticated by
           design. */}}
    - type: metrics-api
      {{- /* Explicit, not relying on the metrics-api scaler's own default: the sum-vs-target
             arithmetic below rests entirely on it, and KEDA's docs don't document a default
             metricType at all. */}}
      metricType: AverageValue
      metadata:
        {{- /* FQDN, not sonarqube.vortex.url's short name: KEDA parses this host as
               <service>.<namespace> to find the Service's EndpointSlices, and rejects a bare short
               name outright. The port must be the *pod* port, not just any port on the Service -
               here they're always the same number (.Values.vortexAnalysis.port), so this is always safe. */}}
        url: "http://{{ include "sonarqube.svcFQDN" (dict "name" (include "sonarqube.vortex.fullname" .) "ctx" .) }}:{{ .Values.vortexAnalysis.port }}{{ .Values.vortexAnalysis.autoscaling.metricPath }}"
        valueLocation: "value"
        targetValue: "{{ .Values.vortexAnalysis.autoscaling.targetConcurrentRequests }}"
        {{- if .Values.vortexAnalysis.autoscaling.aggregateAcrossReplicas }}
        {{- /* sum, not the aggregationType default of average: metricType is pinned to
               AverageValue above, so the HPA computes ceil(metric / targetValue) - an averaged
               metric would cap the whole fleet at ceil(mean/target) regardless of replica count. */}}
        aggregateFromKubeServiceEndpoints: "true"
        aggregationType: "sum"
        {{- end }}
{{- end }}
