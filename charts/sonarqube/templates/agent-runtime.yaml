{{- range $family, $cfg := fromYaml (include "sonarqube.agentRuntimes" .) }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sonarqube.agentRuntime.fullname" (dict "ctx" $ "family" $family) }}
  labels:
    app: {{ template "sonarqube.name" $ }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    sonarqube.agent/component: runtime
    sonarqube.agent/family: {{ $family }}
    app.kubernetes.io/component: agent-runtime-{{ $family }}
spec:
  replicas: {{ $cfg.replicaCount }}
  {{- with $cfg.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  {{- with $cfg.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "sonarqube.agentRuntime.selectorLabels" (dict "ctx" $ "family" $family) | nindent 6 }}
  template:
    metadata:
      {{- with $cfg.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sonarqube.agentRuntime.selectorLabels" (dict "ctx" $ "family" $family) | nindent 8 }}
        sonarqube.agent/component: runtime
        sonarqube.agent/family: {{ $family }}
        {{- with $cfg.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- /* Run the (untrusted) runtimes under the gVisor RuntimeClass when enabled. The
             RuntimeClass' own scheduling.nodeSelector pins these pods to runsc-ready nodes. */}}
      {{- if eq (include "sonarqube.gvisor.enabled" $) "true" }}
      runtimeClassName: {{ $.Values.gvisor.runtimeClassName }}
      {{- end }}
      automountServiceAccountToken: {{ include "sonarqube.agent.automountServiceAccountToken" (dict "ctx" $ "serviceAccount" $cfg.serviceAccount) }}
      {{- $pullSecrets := include "sonarqube.agent.imagePullSecrets" (list $cfg.image) }}
      {{- if $pullSecrets }}
      imagePullSecrets: {{- $pullSecrets | nindent 8 }}
      {{- end }}
      {{- with $cfg.securityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent-runtime
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy }}
          {{- with $cfg.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
          {{- /* Auto-wire each family's mode-switch env var so users don't hand-set it. The hunter
                 runtime reads SCRIPT_PATH (detection mode); the remediation runtime reads
                 REMEDIATION_SCRIPT_PATH plus REMEDIATION_RULE_INFO_ENDPOINT, which points at the
                 in-cluster orchestrator (hunter never calls the orchestrator for rule-info, so it
                 gets no such var). User-provided env (e.g. ANTHROPIC_API_KEY) is appended next and
                 overrides these if repeated - except the proxy vars below, which are appended
                 last and always win: see that comment for why. */}}
          {{- $autoEnv := list }}
          {{- if eq $family "hunter" }}
          {{- with $cfg.scriptPath }}
          {{- $autoEnv = append $autoEnv (dict "name" "SCRIPT_PATH" "value" .) }}
          {{- end }}
          {{- end }}
          {{- if eq $family "remediation" }}
          {{- with $cfg.remediationScriptPath }}
          {{- $autoEnv = append $autoEnv (dict "name" "REMEDIATION_SCRIPT_PATH" "value" .) }}
          {{- end }}
          {{- $autoEnv = append $autoEnv (dict "name" "REMEDIATION_RULE_INFO_ENDPOINT" "value" (printf "%s/remediation-agent/rule-info" (include "sonarqube.agentOrchestrator.url" $))) }}
          {{- end }}
          {{- $mergedEnv := concat $autoEnv ($cfg.env | default list) }}
          {{- /* Proxy env vars are appended LAST, after $cfg.env, and are NOT part of the
                 user-overridable merge above (unlike every other auto-generated var in this
                 file) - a later env entry of the same name wins, so these always take effect
                 even if hunterAgent.env/remediationAgent.env tries to set the same key. This is
                 deliberate: all runtime egress must transit the Agent Egress Proxy with no
                 exceptions, so these vars must not be overridable like the rest of $autoEnv.
                 Both cases are set since not every HTTP client in these images honours only one
                 casing. NO_PROXY/no_proxy are forced to "" (not omitted) so no value can carve
                 out a bypass. */}}
          {{- $proxyURL := include "sonarqube.agentEgressProxy.url" $ }}
          {{- $finalEnv := concat $mergedEnv (list
              (dict "name" "HTTP_PROXY" "value" $proxyURL)
              (dict "name" "http_proxy" "value" $proxyURL)
              (dict "name" "HTTPS_PROXY" "value" $proxyURL)
              (dict "name" "https_proxy" "value" $proxyURL)
              (dict "name" "NO_PROXY" "value" "")
              (dict "name" "no_proxy" "value" "")
          ) }}
          {{- with $finalEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $cfg.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (include "sonarqube.agent.probe" (dict "probe" $cfg.probes.readiness)) }}
          readinessProbe:
{{ . | indent 12 }}
          {{- end }}
          {{- with (include "sonarqube.agent.probe" (dict "probe" $cfg.probes.liveness)) }}
          livenessProbe:
{{ . | indent 12 }}
          {{- end }}
          {{- with $cfg.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with (include "sonarqube.agent.scheduling" (dict "ctx" $ "component" $cfg)) }}
{{ . | indent 6 }}
      {{- end }}
      serviceAccountName: {{ include "sonarqube.agentRuntime.serviceAccountName" (dict "ctx" $ "family" $family) }}
      {{- with $cfg.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
