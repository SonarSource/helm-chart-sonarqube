{{- if and .Values.agentOrchestrator.enabled .Values.agentOrchestrator.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sonarqube.agentOrchestrator.fullname" . }}
  labels:
    app: {{ template "sonarqube.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    sonarqube.agent/component: orchestrator
    app.kubernetes.io/component: agent-orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sonarqube.agentOrchestrator.fullname" . }}
  minReplicas: {{ .Values.agentOrchestrator.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.agentOrchestrator.autoscaling.maxReplicas }}
  metrics:
{{ toYaml .Values.agentOrchestrator.autoscaling.metrics | indent 4 }}
  {{- with .Values.agentOrchestrator.autoscaling.behavior }}
  behavior:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- end }}
