{{- range $family, $cfg := fromYaml (include "sonarqube.agentRuntimes" .) }}
{{- if and $cfg.enabled $cfg.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sonarqube.agentRuntime.fullname" (dict "ctx" $ "family" $family) }}
  labels:
    app: {{ template "sonarqube.name" $ }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    sonarqube.agent/component: runtime
    sonarqube.agent/family: {{ $family }}
    app.kubernetes.io/component: agent-runtime-{{ $family }}
spec:
  podSelector:
    matchLabels: {{- include "sonarqube.agentRuntime.selectorLabels" (dict "ctx" $ "family" $family) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- $meshEnabled := eq (include "sonarqube.agentRuntime.meshSidecar.enabled" $) "true" }}
  {{- $hasEnvoy := eq (include "sonarqube.agentRuntime.hasEnvoy" $) "true" }}
  ingress:
    {{- if $meshEnabled }}
    {{- /* The hand-authored mesh sidecar owns inbound: orchestrator->meshPort, mTLS-terminated by
           the pod's own Envoy, is the only application entry point. $cfg.port - the app's own,
           un-intercepted port - must NOT appear here, or this NetworkPolicy stops being what
           fences it. */}}
    - from:
        - podSelector:
            matchLabels: {{- include "sonarqube.agentOrchestrator.selectorLabels" $ | nindent 14 }}
      ports:
        - port: {{ $.Values.istio.meshSidecar.meshPort }}
          protocol: TCP
    {{- else }}
    - from:
        - podSelector:
            matchLabels: {{- include "sonarqube.agentOrchestrator.selectorLabels" $ | nindent 14 }}
      ports:
        - port: {{ $cfg.port }}
          protocol: TCP
    {{- end }}
    {{- if $hasEnvoy }}
    {{- /* kubelet probes (15020/15021) and Prometheus scrape (15090) - no `from`: these are
           node-local/infra callers a podSelector can't express. Needed for any injected
           sidecar, hand-authored (mesh) or standard. */}}
    - ports:
        - port: 15020
          protocol: TCP
        - port: 15021
          protocol: TCP
        - port: 15090
          protocol: TCP
    {{- end }}
  egress:
    {{- /* istiod, needed only when this family actually gets a sidecar: standard injection (not
           sandboxed), or the hand-authored mesh sidecar. Under a sandbox with the mesh sidecar off
           the pods are stamped sidecar.istio.io/inject: "false" and get no Envoy, so they need no
           control-plane egress at all.

           DNS is deliberately absent wherever it can be, and that absence is load-bearing. Since
           NetworkPolicy selects pods and not containers, every rule here is also a capability
           granted to the untrusted agent container sharing the pod - and reaching a recursive
           resolver is a bidirectional covert egress channel (payload in the query name, answer in
           a TXT record) that neither the Agent Egress Proxy's allowedDomains ACL nor any L3/L4
           rule downstream can see. Envoy does not mediate it either: Istio's iptables rules are
           TCP-only unless DNS capture is explicitly turned on.

           An un-injected runtime resolves nothing at all: it reaches the Agent Egress Proxy by
           ClusterIP, which kubelet hands the pod as a service-link env var (see
           sonarqube.agentEgressProxy.url), so there is no name left to look up. An injected
           runtime needs exactly one name, istiod.<istio.namespace>.svc - and that one is resolved
           by pilot-agent, not Envoy, so istio.istiodClusterIP can supply it through hostAliases
           and this rule drops out too (see sonarqube.agentRuntime.resolverlessMesh).

           That an un-injected runtime really has no Envoy is not an assumption about the cluster:
           agent-runtime.yaml stamps sidecar.istio.io/inject: "false" - as a label, which is what
           the injector webhook's objectSelector filters on - whenever istio.enabled is off, so a
           namespace-wide istio-injection=enabled label cannot quietly hand the pod a sidecar that
           this policy would then leave unable to reach istiod. */}}
    {{- if $hasEnvoy }}
    {{- if ne (include "sonarqube.agentRuntime.resolverlessMesh" $) "true" }}
{{ include "sonarqube.agent.dnsEgressRule" $ | indent 4 }}
    {{- end }}
{{ include "sonarqube.agent.istiodEgressRule" $ | indent 4 }}
    {{- end }}
    {{- /* All other runtime egress - including reaching the orchestrator and reading/writing job
           artifacts against object storage via presigned URLs - transits the Agent Egress Proxy.
           There is no direct-to-orchestrator or direct-to-storage rule here: the proxy's own
           allowedDomains ACL is what decides which destinations a runtime may actually reach. */}}
    - to:
        - podSelector:
            matchLabels: {{- include "sonarqube.agentEgressProxy.selectorLabels" $ | nindent 14 }}
      ports:
        - port: {{ $.Values.agentEgressProxy.port }}
          protocol: TCP
{{- end }}
{{- end }}
