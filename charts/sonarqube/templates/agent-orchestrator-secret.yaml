{{- $storage := .Values.agentOrchestrator.storage }}
{{- /* Inline storage keys only when given and not sourced from an existingSecret; omit entirely for
       credential-less (IAM role / IRSA) access so no empty-valued keys are created. */}}
{{- $inlineStorage := and (not $storage.existingSecret) (or $storage.accessKey $storage.secretKey $storage.azure.connectionString $storage.gcs.credentialsJson) }}
{{- if and .Values.agentOrchestrator.enabled $inlineStorage }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sonarqube.agentOrchestrator.fullname" . }}
  labels:
    app: {{ template "sonarqube.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    sonarqube.agent/component: orchestrator
    app.kubernetes.io/component: agent-orchestrator
type: Opaque
data:
  {{- if or $storage.accessKey $storage.secretKey }}
  AGENTIC_STORAGE_ACCESS_KEY: {{ $storage.accessKey | b64enc | quote }}
  AGENTIC_STORAGE_SECRET_KEY: {{ $storage.secretKey | b64enc | quote }}
  {{- end }}
  {{- if $storage.azure.connectionString }}
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_AZURE_CONNECTION_STRING: {{ $storage.azure.connectionString | b64enc | quote }}
  {{- end }}
  {{- if $storage.gcs.credentialsJson }}
  SONAR_AGENTIC_ORCHESTRATOR_STORAGE_GCS_CREDENTIALS_JSON: {{ $storage.gcs.credentialsJson | b64enc | quote }}
  {{- end }}
{{- end }}
