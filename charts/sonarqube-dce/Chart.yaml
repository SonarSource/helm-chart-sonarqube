apiVersion: v2
name: sonarqube-dce
description: SonarQube is a self-managed, automatic code review tool that systematically helps you deliver clean code. As a core element of our Sonar solution, SonarQube integrates into your existing workflow and detects issues in your code to help you perform continuous code inspections of your projects. The tool analyses 30+ different programming languages and integrates into your CI pipeline and DevOps platform to ensure that your code meets high-quality standards.
type: application
version: 2026.5.1000
appVersion: 2026.4.0
keywords:
  - coverage
  - security
  - code
  - quality
home: https://www.sonarqube.org/
icon: https://raw.githubusercontent.com/SonarSource/sonarqube-static-resources/master/helm/SonarQubeServerLogo.png
sources:
  - https://github.com/SonarSource/helm-chart-sonarqube/tree/master/charts/sonarqube-dce
  - https://github.com/SonarSource/docker-sonarqube
  - https://github.com/SonarSource/sonarqube
kubeVersion: ">= 1.24.0-0"
dependencies:
  - name: keda
    version: 2.20.2
    repository: https://kedacore.github.io/charts
    condition: keda.enabled
maintainers:
  - name: carminevassallo
    email: carmine.vassallo@sonarsource.com
  - name: emma44-m
    email: emma.mansalier@sonarsource.com
  - name: hatem-amairi-sonarsource
    email: hatem.amairi@sonarsource.com
  - name: jimil09
    email: jimil.desai@sonarsource.com
  - name: julienlancelot
    email: julien.lancelot@sonarsource.com
  - name: lukasz-jarocki-sonarsource
    email: lukasz.jarocki@sonarsource.com
  - name: matteo-mara-sonarsource
    email: matteo.mara@sonarsource.com
  - name: navyatejaotturu-sonarsource
    email: navya.otturu@sonarsource.com
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Upgrade Chart's version to 2026.5.1000"
    - kind: changed
      description: "Decouple the chart's version from appVersion: it now follows <SonarQube major>.<minor>.<patch counter>, with the counter starting at 1000 per minor line"
    - kind: changed
      description: "Fail DCE upgrades across an Elasticsearch major while search pods are still running; scale searchNodes.replicaCount to 0 first"
    - kind: changed
      description: "Breaking: The chart now manages Application node liveness/readiness probe handlers; legacy exec/httpGet/tcpSocket/grpc values are ignored, use overrideCommand instead"
    - kind: added
      description: "Set a default MCP pod securityContext (fsGroup: 0), HOME=/data and an optional mcp.initContainers hook so the non-root MCP server can write to /data"
    - kind: removed
      description: "Remove the deprecated ingress-nginx.enabled/nginx.enabled bundled ingress-nginx controller subchart dependency; ingress.enabled remains supported for a self-managed controller, or use httproute (Gateway API)"
    - kind: changed
      description: "Update MCP image to sonarsource/sonarqube-mcp:1.27.0.4335"
    - kind: added
      description: "Add optional gVisor (runsc) sandboxing for the agent runtimes"
    - kind: added
      description: "Add the SonarQube Agent Orchestrator, Hunter Agent and Remediation Agent via agentOrchestrator.enabled, hunterAgent.enabled and remediationAgent.enabled"
    - kind: added
      description: "Set the Hunter Agent's SCRIPT_PATH (detection mode) from hunterAgent.scriptPath"
    - kind: added
      description: "Default the Hunter Agent's PLAYBOOK_KEY/PLAYBOOK_VERSION to appsec/stable via hunterAgent.playbookKey/playbookVersion"
    - kind: added
      description: "Add agentOrchestrator.env/extraVolumes/extraVolumeMounts and a FILESYSTEM/NFS backend for the shared agentic job storage (agentOrchestrator.storage.type)"
    - kind: added
      description: "Mount the sonarSecretKey secret into the Agent Orchestrator and expose its path as AGENTIC_SECRET_KEY_PATH"
    - kind: added
      description: "Add autoscaling for the Agent Orchestrator (CPU/memory HPA) and the Hunter/Remediation Agent runtimes (KEDA ScaledObject) via <component>.autoscaling"
    - kind: added
      description: "Add an optional KEDA operator subchart dependency (keda.enabled) to install KEDA together with the release"
    - kind: changed
      description: "Ship default resource requests and limits for the Hunter Agent and Vortex so neither runs in the BestEffort QoS class"
    - kind: changed
      description: "Point the Agent Orchestrator and agent runtime probes at /readyz//livez instead of /health, and add agentOrchestrator.terminationGracePeriodSeconds"
    - kind: added
      description: "Add <hunterAgent|remediationAgent>.storage to scope each agent runtime to its own subtree of a shared FILESYSTEM/NFS job storage"
    - kind: changed
      description: "Upgrade the bundled JMX Prometheus Exporter to 1.6.0; versions 1.1.0 and later download from GitHub Releases, earlier ones from Maven Central"
    - kind: added
      description: "Add applicationNodes.prometheusExporter.metricsPath (default /metrics) and optional applicationNodes.prometheusExporter.sha256 download verification"
    - kind: changed
      description: "Default exporter downloads from GitHub require access to github.com and release-assets.githubusercontent.com"
    - kind: changed
      description: "Breaking: Built-in JVM metrics use OpenMetrics names (e.g. jvm_memory_bytes_used is now jvm_memory_used_bytes); config.rules metrics are unaffected"
    - kind: changed
      description: "Breaking: The default exporter scrape path is now /metrics instead of /; set applicationNodes.prometheusExporter.metricsPath: / to keep the old path"
    - kind: added
      description: "Sandbox the agent runtimes with Kata Containers instead of gVisor on OpenShift via OpenShift.agentRuntimeClassName (default kata); the RuntimeClass must exist"
    - kind: fixed
      description: "Target openshift-dns on port 5353 (UDP/TCP) in the NetworkPolicy DNS egress rules when OpenShift.enabled is true; the kube-dns rule never matched there"
    - kind: added
      description: "Add KEDA-based autoscaling for Vortex (vortexAnalysis.autoscaling) on its concurrent-request metric; requires KEDA >= 2.20.0"
    - kind: fixed
      description: "Allow a fractional vortexAnalysis.autoscaling.targetConcurrentRequests (e.g. 1.5), as KEDA parses it as a float"
    - kind: fixed
      description: "Stop emitting the Vortex ScaledObject's spec.fallback with aggregateAcrossReplicas: false, where KEDA < 2.17 scaled the fleet down on scrape failure"
    - kind: fixed
      description: "Fix caCerts.configMap mounting a single certificate; omitting configMap.key/path now imports every key, and path without key fails fast"
    - kind: added
      description: "Add istio.enabled to run every chart-owned workload under STRICT mTLS, and istio.meshSidecar.enabled to give sandboxed agent runtimes a mesh identity"
    - kind: added
      description: "Add mcp.nodeSelector/affinity/tolerations (falling back to the chart-wide values) and mcp.topologySpreadConstraints; priorityClassName now also applies to MCP"
    - kind: added
      description: "Add topologySpreadConstraints for Vortex, the Agent Orchestrator and the agent runtimes, and apply the chart-wide priorityClassName to them"
    - kind: fixed
      description: "Fix applicationNodes.jvmOpts/jvmCeOpts being dropped instead of merged when sonar.web.javaOpts/sonar.ce.javaOpts is set in sonarProperties"
    - kind: changed
      description: "Raise the default probe timeoutSeconds to 5 on search and application nodes, and applicationNodes.livenessProbe.failureThreshold to 8"
    - kind: changed
      description: "Agent runtimes reach the Agent Egress Proxy by ClusterIP instead of DNS, dropping their kube-dns egress; recreating the proxy Service requires restarting them"
    - kind: added
      description: "Add istio.istiodClusterIP (default auto) to pin istiod's address in agent runtime pods and drop their kube-dns egress; helm template needs it set"
    - kind: added
      description: "Add istio.revision to target a revisioned (canary) Istio control plane's istiod-<revision> Service"
    - kind: changed
      description: "vortexAnalysis.enabled now defaults to true when remediationAgent.enabled is true"
    - kind: fixed
      description: "Raise the Remediation Agent's default runAsUser/runAsGroup from 1000 to 10001, fixing incomplete generated PR content"
  artifacthub.io/links: |
    - name: support
      url: https://community.sonarsource.com/
    - name: Chart Source
      url: https://github.com/SonarSource/helm-chart-sonarqube/tree/master/charts/sonarqube-dce
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: sonarqube-app
      image: sonarqube:2026.4.0-datacenter-app
    - name: sonarqube-search
      image: sonarqube:2026.4.0-datacenter-search
    - name: sonarqube-mcp
      image: sonarsource/sonarqube-mcp:1.27.0.4335
  charts.openshift.io/name: sonarqube-dce
