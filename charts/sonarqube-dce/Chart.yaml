annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Upgrade Chart's version to 2026.5.0"
    - kind: removed
      description: "Remove the deprecated ingress-nginx.enabled/nginx.enabled bundled ingress-nginx controller subchart dependency; ingress.enabled remains supported for a self-managed controller, or use httproute (Gateway API)"
    - kind: added
      description: "Add optional gVisor (runsc) sandboxing for the agent runtimes"
    - kind: added
      description: "Add the SonarQube Agent Orchestrator, Hunter Agent and Remediation Agent via agentOrchestrator.enabled, hunterAgent.enabled and remediationAgent.enabled"
    - kind: added
      description: "Add agentOrchestrator.env/extraVolumes/extraVolumeMounts, and a FILESYSTEM/NFS backend for the shared agentic job storage via agentOrchestrator.storage.type and vortex.storage.filesystem.baseDir"
    - kind: added
      description: "Add autoscaling for the Agent Orchestrator (agentOrchestrator.autoscaling, a plain CPU/Memory HorizontalPodAutoscaler) and each agent runtime family (hunterAgent/remediationAgent.autoscaling, a KEDA ScaledObject; requires KEDA installed in-cluster, or agentKeda.assumeInstalled set explicitly), with terminationGracePeriodSeconds hardening so an in-flight job survives any scale-down, not just an autoscaler-driven one"
  artifacthub.io/links: |
    - name: support
      url: https://community.sonarsource.com/
    - name: Chart Source
      url: https://github.com/SonarSource/helm-chart-sonarqube/tree/master/charts/sonarqube-dce
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: sonarqube-app
      image: sonarqube:2026.4.0-datacenter-app
    - name: sonarqube-search
      image: sonarqube:2026.4.0-datacenter-search
    - name: sonarqube-mcp
      image: sonarsource/sonarqube-mcp:1.22.0.3040
  charts.openshift.io/name: sonarqube-dce
