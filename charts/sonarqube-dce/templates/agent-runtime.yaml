{{- range $family, $cfg := fromYaml (include "sonarqube.agentRuntimes" .) }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sonarqube.agentRuntime.fullname" (dict "ctx" $ "family" $family) }}
  labels:
    app: {{ template "sonarqube.name" $ }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    sonarqube.agent/component: runtime
    sonarqube.agent/family: {{ $family }}
    app.kubernetes.io/component: agent-runtime-{{ $family }}
spec:
  {{- /* Same guard as agent-orchestrator.yaml, for the KEDA ScaledObject instead of the HPA. */}}
  {{- if or (not $cfg.autoscaling.enabled) (and $.Release.IsInstall $cfg.autoscaling.manageReplicas) }}
  replicas: {{ $cfg.replicaCount }}
  {{- end }}
  {{- with $cfg.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  {{- with $cfg.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "sonarqube.agentRuntime.selectorLabels" (dict "ctx" $ "family" $family) | nindent 6 }}
  template:
    metadata:
      {{- $sandboxed := eq (include "sonarqube.agentRuntime.sandboxed" $) "true" }}
      {{- $meshEnabled := eq (include "sonarqube.agentRuntime.meshSidecar.enabled" $) "true" }}
      {{- if or $cfg.annotations $sandboxed $.Values.istio.enabled }}
      annotations:
        {{- with $cfg.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $sandboxed }}
        {{- /* Istio's iptables-based istio-init container needs NET_ADMIN/raw sockets, which a
               sandboxing RuntimeClass (gVisor, Kata, ...) may not grant - its sidecar would
               permanently CrashLoopBackOff. Opt these pods out of injection rather than mesh
               membership. */}}
        sidecar.istio.io/inject: "false"
        {{- else if $.Values.istio.enabled }}
        {{- /* Explicit, not left to a namespace-wide istio-injection=enabled label: this family's
               PeerAuthentication (peerauthentication.yaml) is STRICT, which rejects any plaintext
               connection - without a sidecar to actually terminate mTLS, the pod doesn't merely go
               unenforced, it stops accepting the plaintext traffic that's now all it can receive. */}}
        sidecar.istio.io/inject: "true"
        {{- end }}
        {{- if $meshEnabled }}
        {{- /* Standard sidecar injection stamps these itself, which is how Prometheus's own
               Kubernetes-SD scrape config finds a pod's proxy metrics. Nothing injects this
               hand-authored one, so without this the pod is invisible to Prometheus (and anything
               built on it, e.g. Kiali's mTLS/traffic graph) despite genuinely enforcing mTLS. */}}
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
        prometheus.io/path: "/stats/prometheus"
        {{- end }}
      {{- end }}
      labels:
        {{- include "sonarqube.agentRuntime.selectorLabels" (dict "ctx" $ "family" $family) | nindent 8 }}
        sonarqube.agent/component: runtime
        sonarqube.agent/family: {{ $family }}
        {{- if $meshEnabled }}
        {{- /* Without this, a caller's own sidecar treats this pod as non-mesh and sends
               plaintext, never attempting mTLS - silently, since every other signal (probes,
               Sidecar resource) still looks healthy. Normally stamped by the injector; here
               there is no injector, so the chart stamps it itself. */}}
        security.istio.io/tlsMode: istio
        {{- end }}
        {{- with $cfg.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- /* Same directive as the annotations block above, duplicated as a label - not
               redundant. The sidecar-injector webhook's objectSelector is a LabelSelector; it
               can only pre-filter admission requests on labels, never annotations. An
               annotation-only "false" here would be invisible to the webhook if a namespace-wide
               istio-injection=enabled label is ever added, and these pods would then get a
               standard sidecar injected on top of - or instead of - the hand-authored one,
               reintroducing the istio-init/NET_ADMIN CrashLoopBackOff this exists to prevent.
               Keep in sync with the annotations block above. */}}
        {{- if $sandboxed }}
        sidecar.istio.io/inject: "false"
        {{- else if $.Values.istio.enabled }}
        sidecar.istio.io/inject: "true"
        {{- end }}
    spec:
      {{- /* Protects an in-flight job from an ordinary scale-down (manual, rollout, node drain, or
             KEDA-driven) dropping it mid-run - independent of whether autoscaling is enabled. */}}
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds }}
      {{- /* Run the (untrusted) runtimes under a sandboxing RuntimeClass when one applies -
             gVisor's own scheduling.nodeSelector pins its pods to runsc-ready nodes; a generic
             agentRuntimeSandbox.runtimeClassName relies on the caller's own node targeting. */}}
      {{- if $sandboxed }}
      runtimeClassName: {{ include "sonarqube.agentRuntime.runtimeClassName" $ }}
      {{- end }}
      automountServiceAccountToken: {{ include "sonarqube.agent.automountServiceAccountToken" (dict "ctx" $ "serviceAccount" $cfg.serviceAccount) }}
      {{- $pullSecrets := include "sonarqube.agent.imagePullSecrets" (list $cfg.image) }}
      {{- if $pullSecrets }}
      imagePullSecrets: {{- $pullSecrets | nindent 8 }}
      {{- end }}
      {{- with (fromYaml (include "sonarqube.agent.containerSecurityContext" (dict "ctx" $ "securityContext" $cfg.securityContext))) }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $meshEnabled }}
      initContainers:
        {{- include "sonarqube.agentRuntime.meshSidecar.container" (dict "ctx" $ "family" $family) | nindent 8 }}
      {{- end }}
      containers:
        - name: agent-runtime
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy }}
          {{- with (fromYaml (include "sonarqube.agent.containerSecurityContext" (dict "ctx" $ "securityContext" $cfg.containerSecurityContext))) }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
          {{- /* Auto-wire each family's mode-switch env var so users don't hand-set it. The hunter
                 runtime reads SCRIPT_PATH (detection mode); the remediation runtime reads
                 REMEDIATION_SCRIPT_PATH plus REMEDIATION_RULE_INFO_ENDPOINT and
                 REMEDIATION_ANALYSIS_ENDPOINT, which point directly at SonarQube Server, not the
                 orchestrator (hunter never calls these endpoints, so it gets no such vars).
                 User-provided env (e.g. ANTHROPIC_API_KEY) is appended next and overrides these
                 if repeated - except the proxy vars below, which are appended last and always
                 win: see that comment for why. */}}
          {{- $autoEnv := list }}
          {{- if eq $family "hunter" }}
          {{- with $cfg.scriptPath }}
          {{- $autoEnv = append $autoEnv (dict "name" "SCRIPT_PATH" "value" .) }}
          {{- end }}
          {{- end }}
          {{- if eq $family "remediation" }}
          {{- with $cfg.remediationScriptPath }}
          {{- $autoEnv = append $autoEnv (dict "name" "REMEDIATION_SCRIPT_PATH" "value" .) }}
          {{- end }}
          {{- $autoEnv = append $autoEnv (dict "name" "REMEDIATION_RULE_INFO_ENDPOINT" "value" (printf "%s/api/rules/show" (include "sonarqube.agent.sonarqube.url" $))) }}
          {{- $autoEnv = append $autoEnv (dict "name" "REMEDIATION_ANALYSIS_ENDPOINT" "value" (printf "%s/api/v2/a3s/private/analyses" (include "sonarqube.agent.sonarqube.url" $))) }}
          {{- end }}
          {{- /* One variable per HKDF-derived key file mounted below - a runtime only ever holds
                 the key for its own hop with the orchestrator (plus, for remediation, its hop to
                 SQS). See sonarqube.agentic.keyPathEnv. */}}
          {{- $autoEnv = concat $autoEnv (include "sonarqube.agentic.keyPathEnv" (dict "ctx" $ "consumer" $family) | fromYamlArray) }}
          {{- $mergedEnv := concat $autoEnv ($cfg.env | default list) }}
          {{- /* Proxy env vars are appended LAST, after $cfg.env, and are NOT part of the
                 user-overridable merge above (unlike every other auto-generated var in this
                 file) - a later env entry of the same name wins, so these always take effect
                 even if hunterAgent.env/remediationAgent.env tries to set the same key. This is
                 deliberate: all runtime egress must transit the Agent Egress Proxy with no
                 exceptions, so these vars must not be overridable like the rest of $autoEnv.
                 Both cases are set since not every HTTP client in these images honours only one
                 casing. NO_PROXY/no_proxy are forced to "" (not omitted) so no value can carve
                 out a bypass. */}}
          {{- $proxyURL := include "sonarqube.agentEgressProxy.url" $ }}
          {{- $finalEnv := concat $mergedEnv (list
              (dict "name" "HTTP_PROXY" "value" $proxyURL)
              (dict "name" "http_proxy" "value" $proxyURL)
              (dict "name" "HTTPS_PROXY" "value" $proxyURL)
              (dict "name" "https_proxy" "value" $proxyURL)
              (dict "name" "NO_PROXY" "value" "")
              (dict "name" "no_proxy" "value" "")
          ) }}
          {{- with $finalEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $cfg.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (include "sonarqube.agent.probe" (dict "probe" $cfg.probes.readiness "rewritePath" (ternary "/app-health/agent-runtime/readyz" "" $meshEnabled))) }}
          readinessProbe:
{{ . | indent 12 }}
          {{- end }}
          {{- with (include "sonarqube.agent.probe" (dict "probe" $cfg.probes.liveness "rewritePath" (ternary "/app-health/agent-runtime/livez" "" $meshEnabled))) }}
          livenessProbe:
{{ . | indent 12 }}
          {{- end }}
          {{- $keyMount := include "sonarqube.agentic.keyVolumeMount" (dict "ctx" $ "consumer" $family "mountPath" (include "sonarqube.agentic.keyDir" $)) }}
          {{- if or $keyMount $cfg.extraVolumeMounts }}
          volumeMounts:
            {{- with $keyMount }}
            {{- . | trim | nindent 12 }}
            {{- end }}
            {{- with $cfg.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- with (include "sonarqube.agent.scheduling" (dict "ctx" $ "component" $cfg)) }}
{{ . | indent 6 }}
      {{- end }}
      serviceAccountName: {{ include "sonarqube.agentRuntime.serviceAccountName" (dict "ctx" $ "family" $family) }}
      {{- $keyVolume := include "sonarqube.agentic.keyVolume" (dict "ctx" $ "consumer" $family) }}
      {{- if or $keyVolume $cfg.extraVolumes $meshEnabled }}
      volumes:
        {{- with $keyVolume }}
        {{- . | trim | nindent 8 }}
        {{- end }}
        {{- if $meshEnabled }}
        {{- include "sonarqube.agentRuntime.meshSidecar.volumes" $ | nindent 8 }}
        {{- end }}
        {{- with $cfg.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
