{{- if and .Values.vortexAnalysis.enabled .Values.vortexAnalysis.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sonarqube.vortexAnalysis.serviceAccountName" . }}
  labels: {{- include "sonarqube.labels" . | nindent 4 }}
    app.kubernetes.io/component: vortex-analysis
  {{- with .Values.vortexAnalysis.serviceAccount.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.vortexAnalysis.serviceAccount.automountToken }}
{{- end }}
