{{- $storage := .Values.vortexAnalysis.storage }}
{{- $inlineStorage := and (not $storage.existingSecret) (or $storage.accessKey $storage.secretKey $storage.azure.connectionString $storage.gcs.credentialsJson) }}
{{- if and (eq (include "sonarqube.vortex.enabled" .) "true") $inlineStorage }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sonarqube.vortex.fullname" . }}
  labels: {{- include "sonarqube.labels" . | nindent 4 }}
    app.kubernetes.io/component: vortex
type: Opaque
data:
  {{- if or $storage.accessKey $storage.secretKey }}
  SONAR_AGENTIC_STORAGE_ACCESS_KEY: {{ $storage.accessKey | b64enc | quote }}
  SONAR_AGENTIC_STORAGE_SECRET_KEY: {{ $storage.secretKey | b64enc | quote }}
  {{- end }}
  {{- if $storage.azure.connectionString }}
  SONAR_AGENTIC_STORAGE_AZURE_CONNECTION_STRING: {{ $storage.azure.connectionString | b64enc | quote }}
  {{- end }}
  {{- if $storage.gcs.credentialsJson }}
  SONAR_AGENTIC_STORAGE_GCS_CREDENTIALS_JSON: {{ $storage.gcs.credentialsJson | b64enc | quote }}
  {{- end }}
{{- end }}
