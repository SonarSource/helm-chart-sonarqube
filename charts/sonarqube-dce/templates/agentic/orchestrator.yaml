{{ $applicationNodes := fromYaml (include "applicationNodes" . ) }}
{{ $_ := set .Values "ApplicationNodes" $applicationNodes }}
{{- if .Values.orchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sonarqube.agentic.orchestrator.fullname" . }}
  labels:
    app: {{ template "sonarqube.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    sonarqube.agentic/component: orchestrator
    app.kubernetes.io/component: agentic-orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  {{- with .Values.orchestrator.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  {{- with .Values.orchestrator.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "sonarqube.agentic.orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/agentic/orchestrator-secret.yaml") . | sha256sum }}
        {{- with .Values.orchestrator.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sonarqube.agentic.orchestrator.selectorLabels" . | nindent 8 }}
        sonarqube.agentic/component: orchestrator
        {{- with .Values.orchestrator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: {{ include "sonarqube.agentic.automountServiceAccountToken" (dict "ctx" . "serviceAccount" .Values.orchestrator.serviceAccount) }}
      {{- /* The wait-for-sonarqube init container below pulls the SonarQube image, so it needs the
             application nodes' pull secrets too - the orchestrator's own only cover its own image. */}}
      {{- $pullSecrets := include "sonarqube.agentic.imagePullSecrets" (list (fromYaml (include "sonarqube.agentic.sonarqubeImage" .)) .Values.orchestrator.image) }}
      {{- if $pullSecrets }}
      imagePullSecrets: {{- $pullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.securityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-sonarqube
          image: {{ include "sonarqube.image" . }}
          imagePullPolicy: {{ (fromYaml (include "sonarqube.agentic.sonarqubeImage" .)).pullPolicy }}
          {{- with (fromYaml (include "sonarqube.agentic.initContainerSecurityContext" .)) }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              until curl -sf "{{ include "sonarqube.agentic.sonarqube.url" . }}/api/system/status" | grep -q '"status":"UP"'; do
                echo "Waiting for SonarQube to be UP..."; sleep 10;
              done
      containers:
        - name: agentic-orchestrator
          image: "{{ .Values.orchestrator.image.repository }}:{{ .Values.orchestrator.image.tag }}"
          imagePullPolicy: {{ .Values.orchestrator.image.pullPolicy }}
          {{- $orchestratorSecurityContext := .Values.orchestrator.containerSecurityContext | default dict }}
          {{- with $orchestratorSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.orchestrator.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.orchestrator.port | quote }}
            {{- if .Values.orchestrator.scheduler.enabled }}
            - name: SONAR_AGENTIC_ORCHESTRATOR_SCHEDULER_ENABLED
              value: "true"
            {{- end }}
            {{- /* CORE DB (SonarQube's database) connection for the orchestrator. Each field is
                   independently configurable via orchestrator.coreDb, defaulting to
                   the shared jdbcOverwrite so it targets the same DB as SonarQube out of the box.
                   Decoupling matters for the password: SonarQube may store an encrypted `{aes-gcm}`
                   value the orchestrator can't decrypt, or a chart-managed secret your GitOps
                   doesn't apply — point coreDb.passwordSecret{Name,Key} at a usable secret. */}}
            {{- $coreDb := .Values.orchestrator.coreDb }}
            - name: CORE_DB_READ_WRITE_ENDPOINT
              value: {{ $coreDb.endpoint | default (include "sonarqube.agentic.jdbc.endpoint" .) | quote }}
            - name: CORE_DB_NAME
              value: {{ $coreDb.name | default (include "sonarqube.agentic.jdbc.dbname" .) | quote }}
            - name: CORE_DB_USERNAME
              {{- if $coreDb.username }}
              value: {{ $coreDb.username | quote }}
              {{- else }}
              value: {{ template "jdbc.username" . }}
              {{- end }}
            - name: CORE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $coreDb.passwordSecretName | default (include "jdbc.secret" .) }}
                  key: {{ $coreDb.passwordSecretKey | default (include "jdbc.secretPasswordKey" .) }}
            - name: AGENTIC_STORAGE_ENDPOINT
              value: {{ .Values.orchestrator.storage.endpoint | quote }}
            - name: AGENTIC_STORAGE_REGION
              value: {{ .Values.orchestrator.storage.region | quote }}
            - name: AGENTIC_STORAGE_BUCKET
              value: {{ .Values.orchestrator.storage.bucket | quote }}
            - name: AGENTIC_STORAGE_PATH_STYLE
              value: {{ .Values.orchestrator.storage.pathStyle | quote }}
            {{- /* Inject static storage keys only when provided (inline or via existingSecret). When
                   none are set, the env vars are omitted so the orchestrator's AWS SDK falls back to
                   its default credential chain - i.e. the pod's IAM identity (node instance role or
                   IRSA) for credential-less access to a real S3 bucket. */}}
            {{- if or .Values.orchestrator.storage.accessKey .Values.orchestrator.storage.secretKey .Values.orchestrator.storage.existingSecret }}
            - name: AGENTIC_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "sonarqube.agentic.orchestrator.fullname" .) .Values.orchestrator.storage.existingSecret }}
                  key: AGENTIC_STORAGE_ACCESS_KEY
            - name: AGENTIC_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "sonarqube.agentic.orchestrator.fullname" .) .Values.orchestrator.storage.existingSecret }}
                  key: AGENTIC_STORAGE_SECRET_KEY
            {{- end }}
            - name: AGENTIC_SONARQUBE_URL
              value: {{ include "sonarqube.agentic.sonarqube.url" . | quote }}
            {{- if or .Values.orchestrator.sonarqubeToken.token .Values.orchestrator.sonarqubeToken.existingSecret }}
            - name: AGENTIC_SONARQUBE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "sonarqube.agentic.orchestrator.fullname" .) .Values.orchestrator.sonarqubeToken.existingSecret }}
                  key: {{ .Values.orchestrator.sonarqubeToken.existingSecretKey | default "AGENTIC_SONARQUBE_TOKEN" }}
            {{- end }}
            {{- range $family, $cfg := fromYaml (include "sonarqube.agentic.runtimes" .) }}
            {{- if $cfg.enabled }}
            - name: AGENTIC_{{ $family | upper }}_RUNTIME_PUSH_URL
              value: {{ include "sonarqube.agentic.runtime.pushUrl" (dict "ctx" $ "family" $family) | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.orchestrator.github.apiBaseUrl }}
            - name: AGENTIC_GITHUB_API_BASE_URL
              value: {{ .Values.orchestrator.github.apiBaseUrl | quote }}
            {{- end }}
            {{- /* No AGENTIC_GITHUB_TOKEN: since SONAR-30903 the orchestrator obtains a short-lived
                   GitHub App installation token from SonarQube on demand (via AGENTIC_SONARQUBE_URL/
                   TOKEN), not from a static env var. */}}
          {{- with .Values.orchestrator.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $orchestratorSecurityContext.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sonarqube.agentic.orchestrator.serviceAccountName" . }}
      {{- if $orchestratorSecurityContext.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
{{- end }}
