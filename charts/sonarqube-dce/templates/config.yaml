{{ $applicationNodes := fromYaml (include "applicationNodes" . ) }}
{{ $_ := set .Values "ApplicationNodes" $applicationNodes }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "sonarqube.fullname" . }}-app-config
  labels:
    app: {{ template "sonarqube.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  sonar.properties: |
  {{- $mergedProps := fromYaml (include "sonarqube.mergedSonarProperties" .) | default dict }}
  {{- range $key, $val := $mergedProps }}
    {{ $key }}={{ $val }}
  {{- end }}
  {{- if .Values.sonarSecretKey }}
    sonar.secretKeyPath={{ .Values.sonarqubeFolder }}/secret/sonar-secret.txt
  {{- end }}
  {{- if .Values.agenticSigningSecretKey }}
    sonar.agentic.signing.secretFile={{ .Values.sonarqubeFolder }}/secret-agentic-signing/sonar-agentic-signing-secret.txt
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "sonarqube.fullname" . }}-search-config
  labels:
    app: {{ template "sonarqube.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  sonar.properties: |
  {{- range $key, $val := .Values.searchNodes.sonarProperties }}
    {{ $key }}={{ $val }}
  {{- end }}
  {{- if .Values.sonarSecretKey }}
    sonar.secretKeyPath={{ .Values.sonarqubeFolder }}/secret/sonar-secret.txt
  {{- end }}
  {{- if .Values.agenticSigningSecretKey }}
    sonar.agentic.signing.secretFile={{ .Values.sonarqubeFolder }}/secret-agentic-signing/sonar-agentic-signing-secret.txt
  {{- end }}
