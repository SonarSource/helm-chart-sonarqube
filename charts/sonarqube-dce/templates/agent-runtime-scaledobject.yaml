{{- range $family, $cfg := fromYaml (include "sonarqube.agentRuntimes" $) }}
{{- if and $cfg.enabled $cfg.autoscaling.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sonarqube.agentRuntime.fullname" (dict "ctx" $ "family" $family) }}
  labels:
    app: {{ template "sonarqube.name" $ }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    sonarqube.agent/component: runtime
    sonarqube.agent/family: {{ $family }}
    app.kubernetes.io/component: agent-runtime-{{ $family }}
spec:
  scaleTargetRef:
    name: {{ include "sonarqube.agentRuntime.fullname" (dict "ctx" $ "family" $family) }}
  minReplicaCount: {{ $cfg.autoscaling.minReplicas }}
  maxReplicaCount: {{ $cfg.autoscaling.maxReplicas }}
  pollingInterval: {{ $cfg.autoscaling.pollingInterval }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ $cfg.autoscaling.scaleDownStabilizationSeconds }}
  triggers:
    {{- /* Reads the Agent Orchestrator's GET /metrics/queue. valueLocation targets the pre-summed
           "<family>.unfinished" field (not "pending" alone) - see the orchestrator's own endpoint
           for why "pending" alone is not a safe scale-up signal. No authenticationRef: the endpoint
           is unauthenticated by design, matching its other permitAll() health/status endpoints. */}}
    - type: metrics-api
      metadata:
        url: "{{ include "sonarqube.agentOrchestrator.url" $ }}/metrics/queue"
        valueLocation: "{{ $family }}.unfinished"
        targetValue: "1"
{{- end }}
{{- end }}
