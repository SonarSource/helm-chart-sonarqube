{{ $applicationNodes := fromYaml (include "applicationNodes" . ) }}
{{ $_ := set .Values "ApplicationNodes" $applicationNodes }}
{{- if .Values.tests.enabled -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-ui-test"
  annotations:
    "helm.sh/hook": test-success
    {{- if .Values.istio.enabled }}
    {{- /* Join the mesh: the app pod's STRICT mTLS otherwise rejects this plaintext curl. */}}
    "sidecar.istio.io/inject": "true"
    {{- else }}
    # Disable Istio sidecar injection for this test pod
    "sidecar.istio.io/inject": "false"
    {{- end }}
  labels:
    app: {{ template "sonarqube.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  automountServiceAccountToken: false
  {{- if or .Values.ApplicationNodes.image.pullSecrets .Values.ApplicationNodes.image.pullSecret }}
  imagePullSecrets:
    {{- if .Values.ApplicationNodes.image.pullSecret }}
    - name: {{ .Values.ApplicationNodes.image.pullSecret }}
    {{- end }}
    {{- if .Values.ApplicationNodes.image.pullSecrets }}
{{ toYaml .Values.ApplicationNodes.image.pullSecrets | indent 4 }}
    {{- end }}
  {{- end }}
  containers:
    - name: {{ .Release.Name }}-ui-test
      image: {{ .Values.tests.image | default (printf "%s:%s" .Values.ApplicationNodes.image.repository .Values.ApplicationNodes.image.tag) | quote }}
      imagePullPolicy: {{ .Values.ApplicationNodes.image.pullPolicy }}
      {{- if .Values.istio.enabled }}
      {{- /* Without a native sidecar (Istio >= 1.27 + Kubernetes >= 1.29), istio-proxy keeps
             running after curl exits, so this test Pod never reaches Succeeded and `helm test`
             times out - request its shutdown, but always exit with curl's own status. */}}
      command: ["sh", "-c", 'curl --retry-connrefused --retry 1200 --retry-delay 1 --max-time 5 -s "{{ template "sonarqube.fullname" . }}:{{ .Values.service.internalPort }}/api/system/status"; rc=$?; curl -sS -m 5 -X POST http://127.0.0.1:15020/quitquitquit || true; exit $rc']
      {{- else }}
      command: ['curl']
      args: [
        '--retry-connrefused',
        '--retry',
        '1200',
        '--retry-delay',
        '1',
        '--max-time',
        '5',
        '-s',
        '{{ template "sonarqube.fullname" . }}:{{ .Values.service.internalPort }}/api/system/status'
        ]
      {{- end }}
      resources:
{{ toYaml .Values.tests.resources | indent 8 }}
  restartPolicy: Never
{{- end -}}
