{{- if .Values.orchestrator.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sonarqube.agent.orchestrator.fullname" . }}
  labels:
    app: {{ template "sonarqube.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    sonarqube.agentic/component: orchestrator
    app.kubernetes.io/component: agent-orchestrator
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.orchestrator.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "sonarqube.agent.orchestrator.selectorLabels" . | nindent 4 }}
{{- end }}
