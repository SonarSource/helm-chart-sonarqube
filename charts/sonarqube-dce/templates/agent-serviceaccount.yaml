{{- /*
Dedicated ServiceAccounts for the agent workloads: one for the orchestrator, one per enabled
runtime family, and one for the Agent Egress Proxy. Each is self-contained (create/name/
automountToken/annotations), independent of the other components, so each pod can bind its own
cloud identity (e.g. an AWS IAM role via IRSA). Names are resolved by the helpers so an external
IAM trust policy can pin exact k8s subjects.
*/}}
{{- if and .Values.agentOrchestrator.enabled .Values.agentOrchestrator.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sonarqube.agentOrchestrator.serviceAccountName" . }}
  labels:
    app: {{ template "sonarqube.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    sonarqube.agent/component: orchestrator
    app.kubernetes.io/component: agent-orchestrator
  {{- with .Values.agentOrchestrator.serviceAccount.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.agentOrchestrator.serviceAccount.automountToken }}
{{- end }}
{{- range $family, $cfg := fromYaml (include "sonarqube.agentRuntimes" .) }}
{{- if and $cfg.enabled $cfg.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sonarqube.agentRuntime.serviceAccountName" (dict "ctx" $ "family" $family) }}
  labels:
    app: {{ template "sonarqube.name" $ }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version | replace "+" "_" }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    sonarqube.agent/component: runtime
    sonarqube.agent/family: {{ $family }}
    app.kubernetes.io/component: agent-runtime-{{ $family }}
  {{- with $cfg.serviceAccount.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $cfg.serviceAccount.automountToken }}
{{- end }}
{{- end }}
{{- if and (include "sonarqube.agentEgressProxy.required" .) .Values.agentEgressProxy.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sonarqube.agentEgressProxy.serviceAccountName" . }}
  labels:
    app: {{ template "sonarqube.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    sonarqube.agent/component: egress-proxy
    app.kubernetes.io/component: agent-egress-proxy
  {{- with .Values.agentEgressProxy.serviceAccount.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.agentEgressProxy.serviceAccount.automountToken }}
{{- end }}
