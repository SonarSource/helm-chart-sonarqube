{{- if .Values.vortexAnalysis.enabled }}
{{- $vortex := .Values.vortexAnalysis }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sonarqube.vortexAnalysis.fullname" . }}
  labels: {{- include "sonarqube.labels" . | nindent 4 }}
    app.kubernetes.io/component: vortex-analysis
spec:
  replicas: {{ $vortex.replicaCount }}
  {{- with $vortex.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "sonarqube.name" . }}-vortex-analysis
      release: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/vortex-analysis-secret.yaml") . | sha256sum }}
        {{- with $vortex.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: {{ include "sonarqube.name" . }}-vortex-analysis
        release: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- if or .Values.ApplicationNodes.image.pullSecrets .Values.ApplicationNodes.image.pullSecret $vortex.image.pullSecrets }}
      imagePullSecrets:
        {{- if .Values.ApplicationNodes.image.pullSecret }}
        - name: {{ .Values.ApplicationNodes.image.pullSecret }}
        {{- end }}
        {{- with .Values.ApplicationNodes.image.pullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $vortex.image.pullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: vortex-analysis
          image: {{ printf "%s:%s" $vortex.image.repository (default "latest" $vortex.image.tag) }}
          imagePullPolicy: {{ $vortex.image.pullPolicy }}
          {{- with $vortex.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $vortex.port }}
              protocol: TCP
          env:
            - name: VORTEX_ANALYSIS_SONARQUBE_URL
              value: {{ printf "http://%s:%d%s" (include "sonarqube.fullname" .) (int .Values.service.externalPort) (trimSuffix "/" (include "sonarqube.webcontext" .)) | quote }}
            {{- if or $vortex.sonarqubeToken.token $vortex.sonarqubeToken.existingSecret }}
            - name: VORTEX_ANALYSIS_SONARQUBE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "sonarqube.vortexAnalysis.fullname" .) $vortex.sonarqubeToken.existingSecret }}
                  key: {{ $vortex.sonarqubeToken.existingSecretKey | default "VORTEX_ANALYSIS_SONARQUBE_TOKEN" }}
            {{- end }}
            {{- with $vortex.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $vortex.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          {{- with $vortex.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      {{- end }}
      {{- with $vortex.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
