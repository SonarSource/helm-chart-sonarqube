{{- if include "sonarqube.agentEgressProxy.required" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sonarqube.agentEgressProxy.fullname" . }}
  labels:
    app: {{ template "sonarqube.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    sonarqube.agent/component: egress-proxy
    app.kubernetes.io/component: agent-egress-proxy
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.agentEgressProxy.port }}
      targetPort: {{ ternary "tcp-proxy" "http-proxy" .Values.istio.enabled }}
      protocol: TCP
      name: {{ ternary "tcp-proxy" "http-proxy" .Values.istio.enabled }}
  selector: {{- include "sonarqube.agentEgressProxy.selectorLabels" . | nindent 4 }}
{{- end }}
