{{/* Validation for monitoring passcode */}}
{{- if or (and (not .Values.monitoringPasscode) (not .Values.monitoringPasscodeSecretName) (not .Values.monitoringPasscodeSecretKey)) (and (not .Values.monitoringPasscodeSecretName) .Values.monitoringPasscodeSecretKey) (and .Values.monitoringPasscodeSecretName (not .Values.monitoringPasscodeSecretKey)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n Please provide a passcode either setting \"monitoringPasscode\" or \"monitoringPasscodeSecretName\" and \"monitoringPasscodeSecretKey\"" -}}
{{- end -}}

{{/* Validation for jwtSecret and existingJwtSecret (XOR check) */}}
{{- if or (and .Values.ApplicationNodes.jwtSecret .Values.ApplicationNodes.existingJwtSecret) (and (not .Values.ApplicationNodes.jwtSecret) (not .Values.ApplicationNodes.existingJwtSecret)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n You must set a value for either \"jwtSecret\" or \"existingJwtSecret\", but not both." -}}
{{- end -}}

{{/* Validation for jdbcOverwrite.enabled or jdbcOverwrite.enable set to false */}}
{{- if or (eq .Values.jdbcOverwrite.enabled false) (eq .Values.jdbcOverwrite.enable false) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n jdbcOverwrite.enabled and jdbcOverwrite.enable cannot be set to false. You must provide an external database configuration." -}}
{{- end -}}

{{/* Validation for jdbcOverwrite configuration when enabled */}}
  {{- $jdbcUrlEmpty := not .Values.jdbcOverwrite.jdbcUrl -}}
  {{- $jdbcUsernameEmpty := not .Values.jdbcOverwrite.jdbcUsername -}}
  {{- $jdbcPasswordEmpty := not .Values.jdbcOverwrite.jdbcPassword -}}
  {{- $jdbcSecretEmpty := not .Values.jdbcOverwrite.jdbcSecretName -}}
  {{- $jdbcSecretKeyEmpty := not .Values.jdbcOverwrite.jdbcSecretPasswordKey -}}
  
  {{- if or $jdbcUrlEmpty $jdbcUsernameEmpty (and $jdbcPasswordEmpty (or $jdbcSecretEmpty $jdbcSecretKeyEmpty)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n You must provide:\n - jdbcOverwrite.jdbcUrl\n - jdbcOverwrite.jdbcUsername\n - jdbcOverwrite.jdbcPassword OR both jdbcOverwrite.jdbcSecretName and jdbcOverwrite.jdbcSecretPasswordKey" -}}
  {{- end -}}
  
{{/* Validation for jdbcUrl - must not be the default placeholder value */}}
  {{- if eq .Values.jdbcOverwrite.jdbcUrl "jdbc:postgresql://myPostgres/myDatabase" -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n jdbcOverwrite.jdbcUrl is still set to the default placeholder value 'jdbc:postgresql://myPostgres/myDatabase'.\n Please provide a valid JDBC URL for your PostgreSQL database." -}}
  {{- end -}}

{{/* Validation for the Agent Orchestrator, when enabled */}}
{{- if .Values.agentOrchestrator.enabled -}}
  {{- if not .Values.agentOrchestrator.image.repository -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but agentOrchestrator.image.repository is not set." -}}
  {{- end -}}
  {{/* Whether an explicitly-configured agentOrchestrator.image needs a tag is that install's own
       business - plenty of fixtures/private registries key on a mutable tag per repository and
       that's fine. But the chart's own repository default ("sonarsource/sonarqube-agent-orchestrator")
       has no matching tag default (no build exists yet), so leaving the image config untouched
       entirely would silently render "sonarsource/sonarqube-agent-orchestrator:" - an unpullable
       reference no node can resolve. Only guard that exact untouched-default case. */}}
  {{- if and (eq .Values.agentOrchestrator.image.repository "sonarsource/sonarqube-agent-orchestrator") (not .Values.agentOrchestrator.image.tag) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true and agentOrchestrator.image.repository is still the chart's default, which has no matching default tag. Set agentOrchestrator.image.tag explicitly." -}}
  {{- end -}}
  {{- $agentOrchestratorStorage := .Values.agentOrchestrator.storage -}}
  {{- /* bucket is meaningless for a file-based backend (FILESYSTEM, NFS): those hand the runtime a
         direct file:// path instead of a presigned URL, per StorageProvider's own semantics - they
         need filesystem.baseDir instead. Stay strict either way - an unset bucket must not silently
         fall back to StoragePropertiesParser's "agentic-jobs" placeholder, and an unset baseDir must
         not silently fall back to its per-service default directory (breaking the shared mount the
         orchestrator and runtimes rely on). */}}
  {{- if has $agentOrchestratorStorage.type (list "FILESYSTEM" "NFS") -}}
    {{- if not $agentOrchestratorStorage.filesystem.baseDir -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.storage.type is FILESYSTEM/NFS but agentOrchestrator.storage.filesystem.baseDir is not set." -}}
    {{- end -}}
  {{- else if not $agentOrchestratorStorage.bucket -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but agentOrchestrator.storage.bucket is not set." -}}
  {{- end -}}
  {{- if and (not $agentOrchestratorStorage.existingSecret) (or $agentOrchestratorStorage.accessKey $agentOrchestratorStorage.secretKey) (not (and $agentOrchestratorStorage.accessKey $agentOrchestratorStorage.secretKey)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but only one of agentOrchestrator.storage.accessKey / agentOrchestrator.storage.secretKey is set. Provide both, or neither for credential-less access." -}}
  {{- end -}}
  {{- if and (not .Values.agentOrchestrator.coreDb.endpoint) (not (include "sonarqube.agent.jdbc.endpoint" .)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but the CORE DB endpoint could not be derived from jdbcOverwrite.jdbcUrl and agentOrchestrator.coreDb.endpoint is not set." -}}
  {{- end -}}
  {{- if and (not .Values.agentOrchestrator.coreDb.name) (not (include "sonarqube.agent.jdbc.dbname" .)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but the CORE DB name could not be derived from jdbcOverwrite.jdbcUrl and agentOrchestrator.coreDb.name is not set." -}}
  {{- end -}}
  {{- /* The orchestrator only exists to dispatch jobs to an agent runtime - with neither hunterAgent
         nor remediationAgent enabled, it has nothing to talk to. */}}
  {{- if not (or .Values.hunterAgent.enabled .Values.remediationAgent.enabled) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.enabled is true but neither hunterAgent.enabled nor remediationAgent.enabled is true. The orchestrator has no agent runtime to dispatch jobs to." -}}
  {{- end -}}
{{- end -}}

{{/* Validation for hunterAgent/remediationAgent dependencies, when enabled */}}
{{- if .Values.hunterAgent.enabled -}}
  {{- if not .Values.agentOrchestrator.enabled -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n hunterAgent.enabled is true but agentOrchestrator.enabled is not true." -}}
  {{- end -}}
{{- end -}}
{{- if .Values.remediationAgent.enabled -}}
  {{- if not .Values.agentOrchestrator.enabled -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n remediationAgent.enabled is true but agentOrchestrator.enabled is not true." -}}
  {{- end -}}
  {{- if eq .Values.vortexAnalysis.enabled false -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n remediationAgent.enabled is true but vortexAnalysis.enabled is explicitly set to false." -}}
  {{- end -}}
  {{- /* agentEgressProxy.remediationPort only opens a second http_port directive in
         agent-egress-proxy-configmap.yaml's squid.conf when remediationAgent.enabled - both
         listeners live in the same Squid container, so an equal port is a duplicate bind Squid
         refuses to start with. */ -}}
  {{- if eq (int .Values.agentEgressProxy.port) (int .Values.agentEgressProxy.remediationPort) -}}
{{- fail (printf "\n ** The values.yaml file is not valid. ** \n agentEgressProxy.remediationPort (%d) must differ from agentEgressProxy.port - both are http_port directives in the same Squid container." (int .Values.agentEgressProxy.remediationPort)) -}}
  {{- end -}}
  {{- /* Same fail-closed precedent as the meshPort-vs-runtime-port check inside
         sonarqube.agentRuntime.meshSidecar.enabled (_helpers.tpl) - reusing that define rather than
         re-deriving its gate means this only fires when istio.meshSidecar.enabled is actually in
         effect (istio.enabled, the runtime sandboxed, and the mesh sidecar itself enabled), unlike
         an earlier attempt at this check that false-fired regardless of whether the mesh sidecar
         was in play at all. */ -}}
  {{- if eq (include "sonarqube.agentRuntime.meshSidecar.enabled" .) "true" -}}
    {{- if eq (int .Values.agentEgressProxy.remediationPort) (int .Values.istio.meshSidecar.meshPort) -}}
{{- fail (printf "\n ** The values.yaml file is not valid. ** \n agentEgressProxy.remediationPort (%d) must differ from istio.meshSidecar.meshPort." (int .Values.agentEgressProxy.remediationPort)) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{/* When a runtime's storage.filesystem.baseDir is set, its extraVolumeMounts must contain a
     matching mountPath, or the orchestrator's file:// handoff resolves to nothing on that
     runtime. */}}
{{- range $family, $cfg := fromYaml (include "sonarqube.agentRuntimes" $) -}}
  {{- if $cfg.enabled -}}
    {{- $storageCfg := $cfg.storage | default dict -}}
    {{- $fsCfg := $storageCfg.filesystem | default dict -}}
    {{- with $fsCfg.baseDir -}}
      {{- $rawBaseDir := . -}}
      {{- $baseDir := regexReplaceAll "/+$" . "" | default "/" -}}
      {{- $mounted := false -}}
      {{- range $cfg.extraVolumeMounts -}}
        {{- $mountPath := regexReplaceAll "/+$" (default "" .mountPath | toString) "" | default "/" -}}
        {{- if or (eq $mountPath $baseDir) (hasPrefix (printf "%s/" $mountPath) $baseDir) -}}
          {{- $mounted = true -}}
        {{- end -}}
      {{- end -}}
      {{- if not $mounted -}}
{{- fail (printf "\n ** The values.yaml file is not valid. ** \n %sAgent.storage.filesystem.baseDir is set to %q but no %sAgent.extraVolumeMounts entry has a matching mountPath, at that path or an ancestor of it." $family $rawBaseDir $family) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{/* Autoscaling validation: minReplicas floor of 2 (no scale-to-zero), maxReplicas >= minReplicas,
     and KEDA CRDs present for any runtime family or Vortex - gated on the component's own enabled
     flag too, matching the render guards in
     agent-orchestrator-hpa.yaml/agent-runtime-scaledobject.yaml/vortex-scaledobject.yaml. $kedaAvailable
     below is computed once here and reused by the Vortex block further down. */}}
{{- $agentOrchestratorAutoscaling := and .Values.agentOrchestrator.enabled .Values.agentOrchestrator.autoscaling.enabled -}}
{{- if and $agentOrchestratorAutoscaling (lt (int .Values.agentOrchestrator.autoscaling.minReplicas) 2) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.autoscaling.minReplicas must be >= 2." -}}
{{- end -}}
{{- if and $agentOrchestratorAutoscaling (gt (int .Values.agentOrchestrator.autoscaling.minReplicas) (int .Values.agentOrchestrator.autoscaling.maxReplicas)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentOrchestrator.autoscaling.maxReplicas must be >= minReplicas." -}}
{{- end -}}
{{- $kedaOverride := .Values.agentKeda.assumeInstalled -}}
{{/* keda.enabled only queues this release's own KEDA subchart install in the same apply pass, so it
     is not proof the CRDs already exist - only a real API-server check (or assumeInstalled) is. */}}
{{- $kedaAvailable := $.Capabilities.APIVersions.Has "keda.sh/v1alpha1" -}}
{{- if not (kindIs "invalid" $kedaOverride) -}}
  {{- $kedaAvailable = $kedaOverride -}}
{{- end -}}
{{- range $family, $cfg := fromYaml (include "sonarqube.agentRuntimes" $) -}}
  {{- if and $cfg.enabled $cfg.autoscaling.enabled -}}
    {{- if lt (int $cfg.autoscaling.minReplicas) 2 -}}
{{- fail (printf "\n ** The values.yaml file is not valid. ** \n %sAgent.autoscaling.minReplicas must be >= 2 (scale-to-zero and single-replica autoscaling are not supported for the agent runtimes)." $family) -}}
    {{- end -}}
    {{- if gt (int $cfg.autoscaling.minReplicas) (int $cfg.autoscaling.maxReplicas) -}}
{{- fail (printf "\n ** The values.yaml file is not valid. ** \n %sAgent.autoscaling.maxReplicas must be >= minReplicas." $family) -}}
    {{- end -}}
    {{- if not $kedaAvailable -}}
{{- fail (printf "\n ** The values.yaml file is not valid. ** \n %sAgent.autoscaling.enabled is true but the KEDA CRDs (keda.sh/v1alpha1) were not detected. Install KEDA (https://keda.sh) first, or set agentKeda.assumeInstalled=true once it is, or disable autoscaling for this family." $family) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{/* Validation for Vortex, when enabled (explicitly, or implicitly via remediationAgent.enabled) */}}
{{- if eq (include "sonarqube.vortex.enabled" .) "true" -}}
  {{- if not .Values.vortexAnalysis.image.repository -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.enabled is true but vortexAnalysis.image.repository is not set." -}}
  {{- end -}}
  {{- if not .Values.vortexAnalysis.image.tag -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.enabled is true but vortexAnalysis.image.tag is not set." -}}
  {{- end -}}
  {{- $storage := .Values.vortexAnalysis.storage -}}
  {{- if not $storage.type -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.enabled is true but vortexAnalysis.storage.type is not set." -}}
  {{- end -}}
  {{- /* bucket/region are meaningless for a file-based backend (FILESYSTEM, NFS) - see the
         matching comment on agentOrchestrator.storage above. */}}
  {{- if has $storage.type (list "FILESYSTEM" "NFS") -}}
    {{- if not $storage.filesystem.baseDir -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.storage.type is FILESYSTEM/NFS but vortexAnalysis.storage.filesystem.baseDir is not set." -}}
    {{- end -}}
  {{- else -}}
    {{- if not $storage.bucket -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.enabled is true but vortexAnalysis.storage.bucket is not set." -}}
    {{- end -}}
    {{- if not $storage.region -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.enabled is true but vortexAnalysis.storage.region is not set." -}}
    {{- end -}}
  {{- end -}}
  {{- if and (not $storage.existingSecret) (or $storage.accessKey $storage.secretKey) (not (and $storage.accessKey $storage.secretKey)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.enabled is true but only one of vortexAnalysis.storage.accessKey / vortexAnalysis.storage.secretKey is set. Provide both, or neither for credential-less access." -}}
  {{- end -}}
  {{- $vortexAutoscaling := .Values.vortexAnalysis.autoscaling -}}
  {{- if $vortexAutoscaling.enabled -}}
    {{- if $vortexAutoscaling.aggregateAcrossReplicas -}}
      {{- if lt (int $vortexAutoscaling.minReplicas) 2 -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.autoscaling.minReplicas must be >= 2 (scale-to-zero and single-replica autoscaling are not supported for Vortex)." -}}
      {{- end -}}
    {{- else -}}
      {{- /* Without cross-replica aggregation, KEDA samples one random replica's peak against the
             fleet-wide target - only an accurate estimate when there is exactly one replica, so
             unlike the floor above this must be an equality, not just a relaxed >= 1 floor. */}}
      {{- if ne (int $vortexAutoscaling.minReplicas) 1 -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.autoscaling.aggregateAcrossReplicas is false, which requires vortexAnalysis.autoscaling.minReplicas to be exactly 1: the single-replica probe this falls back to is only an accurate estimate for the whole fleet when there is exactly one replica." -}}
      {{- end -}}
    {{- end -}}
    {{- if gt (int $vortexAutoscaling.minReplicas) (int $vortexAutoscaling.maxReplicas) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.autoscaling.maxReplicas must be >= minReplicas." -}}
    {{- end -}}
    {{- if not $kedaAvailable -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.autoscaling.enabled is true but the KEDA CRDs (keda.sh/v1alpha1) were not detected. Install KEDA (https://keda.sh) first, or set agentKeda.assumeInstalled=true once it is, or disable autoscaling." -}}
    {{- end -}}
    {{- /* Polling slower than the window loses peaks between polls - the metric would silently
           under-report. Only checked when windowSeconds is set; blank leaves the image's own
           default, which this chart can't compare against. */}}
    {{- if and $vortexAutoscaling.windowSeconds (gt (int $vortexAutoscaling.pollingInterval) (int $vortexAutoscaling.windowSeconds)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.autoscaling.pollingInterval must be <= vortexAnalysis.autoscaling.windowSeconds, or peaks between polls are lost." -}}
    {{- end -}}
    {{- if lt (float64 $vortexAutoscaling.targetConcurrentRequests) 1.0 -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.autoscaling.targetConcurrentRequests must be >= 1." -}}
    {{- end -}}
    {{- if not (hasPrefix "/" $vortexAutoscaling.metricPath) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.autoscaling.metricPath must start with \"/\"." -}}
    {{- end -}}
    {{- /* Recreate takes every Vortex replica down at once on each rollout - fine for a single
           pod, actively wrong once the autoscaler is expected to keep the fleet up. Fail rather
           than silently overriding an explicit values.yaml setting. dig reads .type nil-safely -
           vortex.yaml's own {{- with $vortex.strategy }} tolerates vortexAnalysis.strategy: null (falling
           back to Kubernetes' own RollingUpdate default), and a plain .type read would panic on
           that nil instead of evaluating to a readable message. */}}
    {{- if eq (dig "type" "" (default dict .Values.vortexAnalysis.strategy)) "Recreate" -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n vortexAnalysis.autoscaling.enabled is true but vortexAnalysis.strategy.type is \"Recreate\", which would take down every Vortex replica on every rollout. Set vortexAnalysis.strategy.type: RollingUpdate to enable autoscaling." -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{/* Validation for the agentic signing secret: fail closed if any agentic component that needs
     derived signing/verification keys (hunterAgent/remediationAgent/vortexAnalysis) is enabled without an
     instance secret for the key-derivation hook Job to derive them from. */}}
{{- if eq (include "sonarqube.agentic.enabled" .) "true" -}}
  {{- if or (not .Values.agenticSigningSecret) (not .Values.agenticSigningSecret.existingSecret) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n One of hunterAgent.enabled / remediationAgent.enabled / vortexAnalysis.enabled is true but agenticSigningSecret.existingSecret is not set. Provide the name of an existing Secret holding the operator-provided agentic instance secret." -}}
  {{- end -}}
  {{/* The hook Job runs derive-keys.sh, which only exists inside the Agent Orchestrator image
       (baked in there so air-gapped installs don't need a second image pull, per EA-791/ADR-10).
       vortexAnalysis.enabled alone needs derived keys without otherwise deploying the orchestrator, hence
       agentKeyDerivation.image as an override rather than a hard read of agentOrchestrator.image. */}}
  {{- if and .Values.agentKeyDerivation.enabled (not (include "sonarqube.agentKeyDerivation.imageRepository" .)) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n The agentic key-derivation hook Job needs an image carrying derive-keys.sh. Set agentOrchestrator.image.repository, or agentKeyDerivation.image.repository when the orchestrator isn't part of this install, or set agentKeyDerivation.enabled=false and provide the <fullname>-agentic-keys-* Secrets yourself." -}}
  {{- end -}}
  {{/* Check the tag on the override too: the fallback is all-or-nothing, so setting only
       agentKeyDerivation.image.repository renders "repo:" - an invalid reference the pod can never
       pull, which would hang the hook until activeDeadlineSeconds and fail the release with an
       opaque timeout instead of this message. Only the override is checked here; whether
       agentOrchestrator.image needs a tag is that component's business, not the hook's. */}}
  {{- if and .Values.agentKeyDerivation.enabled .Values.agentKeyDerivation.image.repository (not .Values.agentKeyDerivation.image.tag) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentKeyDerivation.image.repository is set but agentKeyDerivation.image.tag is not. The image fallback is all-or-nothing: once you name a repository, the tag has to come from the same block." -}}
  {{- end -}}
  {{/* When the hook falls back to agentOrchestrator.image (no agentKeyDerivation.image override)
       and agentOrchestrator.enabled is not true, nothing else in this install ever checks that
       image's tag - agentOrchestrator.image.repository can carry a non-empty chart default with
       no tag, which would otherwise render "repo:" and hang the hook until
       activeDeadlineSeconds. Only guard the disabled case: an enabled orchestrator's own tag is
       still that component's business, not the hook's. */}}
  {{- if and .Values.agentKeyDerivation.enabled (not .Values.agentKeyDerivation.image.repository) (not .Values.agentOrchestrator.enabled) .Values.agentOrchestrator.image.repository (not .Values.agentOrchestrator.image.tag) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n The agentic key-derivation hook Job needs an image carrying derive-keys.sh. It would fall back to agentOrchestrator.image.repository, which is set but has no tag, and agentOrchestrator.enabled is not true so nothing else validates it. Set agentKeyDerivation.image.repository/tag explicitly, or agentOrchestrator.image.tag, or set agentKeyDerivation.enabled=false and provide the <fullname>-agentic-keys-* Secrets yourself." -}}
  {{- end -}}
  {{/* The hook's Role grants namespace-wide `create` on Secrets (create can't be scoped by
       name) plus `update` restricted to this release's <fullname>-agentic-keys-* Secrets. With
       agentKeyDerivation.serviceAccount.create=false the binding follows the release's top-level
       ServiceAccount, which is "default" unless it is created or named - that would hand
       Secret-create access to every unrelated pod in the namespace running as default. */}}
  {{- if and (eq (include "sonarqube.agentKeyDerivation.required" .) "true") (not .Values.agentKeyDerivation.serviceAccount.create) (eq (include "sonarqube.agentKeyDerivation.serviceAccountName" .) "default") -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentKeyDerivation.serviceAccount.create=false needs a dedicated ServiceAccount to bind the Secret-writing Role to. Set agentKeyDerivation.serviceAccount.name (or serviceAccount.name), so the Role isn't bound to the namespace's 'default' ServiceAccount." -}}
  {{- end -}}
{{- end -}}

{{/* Validation for the gVisor toggles (gvisor.*). The sub-options are only checked
     when gVisor is enabled: with gvisor.enabled=false the whole feature renders nothing, so a
     leftover installer.enabled (e.g. a base values file overlaid by one that disables gVisor) is
     inert and must not fail the install. */}}
{{- $gvisor := .Values.gvisor -}}
{{- if eq (include "sonarqube.gvisor.enabled" .) "true" -}}
  {{- if not $gvisor.runtimeClassName -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n gvisor.enabled=true requires a non-empty gvisor.runtimeClassName." -}}
  {{- end -}}
  {{- if not $gvisor.handler -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n gvisor.enabled=true requires a non-empty gvisor.handler (the CRI runtime handler)." -}}
  {{- end -}}
  {{- if and $gvisor.installer.enabled (not $gvisor.installer.image.repository) -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n gvisor.installer.enabled=true requires a non-empty gvisor.installer.image.repository." -}}
  {{- end -}}
  {{/* The RuntimeClass merges gvisor.nodeSelector into each runtime pod's own nodeSelector; a
       shared key with different values makes the pod unschedulable at admission. */}}
  {{- range $family, $cfg := fromYaml (include "sonarqube.agentRuntimes" $) -}}
    {{- if $cfg.enabled -}}
      {{- $effective := default $.Values.nodeSelector $cfg.nodeSelector -}}
      {{- range $key, $val := $gvisor.nodeSelector -}}
        {{/* toString both sides: a non-string label value would otherwise make ne fail with a raw
             Go template type error instead of a readable message. */}}
        {{- if and (hasKey $effective $key) (ne (toString (index $effective $key)) (toString $val)) -}}
{{- fail (printf "\n ** The values.yaml file is not valid. ** \n %sAgent's effective nodeSelector conflicts with gvisor.nodeSelector on key %q (%q vs %q)." $family $key (toString (index $effective $key)) (toString $val)) -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{/* Validation for agentRuntimeSandbox.* - the generic, non-gVisor alternative. Same "inert
     unless a runtime is enabled" precedent as the gVisor block above. */}}
{{- if and .Values.agentRuntimeSandbox.enabled (or .Values.hunterAgent.enabled .Values.remediationAgent.enabled) -}}
  {{- if not .Values.agentRuntimeSandbox.runtimeClassName -}}
{{- fail "\n ** The values.yaml file is not valid. ** \n agentRuntimeSandbox.enabled=true requires a non-empty agentRuntimeSandbox.runtimeClassName." -}}
  {{- end -}}
{{- end -}}

{{/* Validation for istio.enabled - the Hazelcast web/CE channels have to be pinned.
     Left unset, Hazelcast picks both ports at runtime, so service.yaml and
     sonarqube-application.yaml skip their port entries altogether (each is guarded by an
     `if .Values.ApplicationNodes.webPort` / `.cePort`) and Istio never learns the ports exist.
     Enforced here rather than left to the README because the symptom surfaces long after a
     successful-looking install - a half-formed Hazelcast cluster - with nothing pointing back
     at a missing value.
     Read through the applicationNodes helper instead of .Values.ApplicationNodes directly: the
     deprecated capitalised key is merged in there, and this template has no guarantee that a
     sibling's `set .Values "ApplicationNodes"` shim rendered first. */}}
{{- if .Values.istio.enabled -}}
  {{- $appNodes := fromYaml (include "applicationNodes" .) -}}
  {{- $missing := list -}}
  {{- if not $appNodes.webPort -}}
    {{- $missing = append $missing "applicationNodes.webPort" -}}
  {{- end -}}
  {{- if not $appNodes.cePort -}}
    {{- $missing = append $missing "applicationNodes.cePort" -}}
  {{- end -}}
  {{- if $missing -}}
{{- fail (printf "\n ** The values.yaml file is not valid. ** \n istio.enabled is true but the Hazelcast web/CE ports are not pinned (missing: %s). Istio only manages ports that are declared up front, and Hazelcast allocates these two dynamically when unset - so the Web and Compute Engine cluster channels are left off the application Service and container ports, and out of the mesh with them. Pin both to fixed, free ports (for example applicationNodes.webPort: 4023 and applicationNodes.cePort: 4024). See \"Working with Istio\" in the chart README." (join ", " $missing)) -}}
  {{- end -}}
{{- end -}}

{{- include "sonarqube.search.assertEsMajorUpgrade" . -}}


{{/* The Kata RuntimeClass the agent runtimes are sandboxed with on OpenShift has to already exist;
     see the helper for why this can only be checked against a live cluster. */}}
{{- include "sonarqube.openshift.assertAgentRuntimeClass" . -}}

{{/* Fail closed instead of silently reopening the DNS egress rule when a runtime's Envoy needs
     istiod's address but the live ClusterIP lookup didn't produce one: no live cluster (e.g.
     `helm template`), a wrong istio.namespace/istio.revision, istiod not installed yet, or a
     headless istiod Service. Only checked while istio.istiodClusterIP is still "auto" - an
     explicit override (a real ClusterIP, or "" to knowingly accept the DNS fallback) is a
     deliberate choice and is not second-guessed here. See sonarqube.agentRuntime.istiodClusterIP
     and the DNS comment in agent-networkpolicy.yaml for why this rule's absence is load-bearing. */}}
{{- if and (eq (include "sonarqube.agentRuntime.hasEnvoy" .) "true") (eq (toString (.Values.istio.istiodClusterIP | default "")) "auto") -}}
  {{- if ne (include "sonarqube.agentRuntime.resolverlessMesh" .) "true" -}}
{{- fail (printf "\n ** The values.yaml file is not valid. ** \n istio.istiodClusterIP is \"auto\" but the %q Service in namespace %q could not be resolved to a usable ClusterIP at render time - no live cluster, a wrong istio.namespace/istio.revision, istiod not installed yet, or a headless Service. Without it, the agent runtime falls back to a kube-dns/openshift-dns egress rule, reopening the DNS covert channel this design exists to close. Fix istio.namespace/istio.revision, install istiod first, or set istio.istiodClusterIP explicitly (a real ClusterIP, or \"\" to knowingly accept DNS egress) to bypass this check." (include "sonarqube.istio.istiodServiceName" .) .Values.istio.namespace) -}}
  {{- end -}}
{{- end -}}
