community:
  enabled: true
monitoringPasscode: test-passcode
jdbcOverwrite:
  enabled: true
  jdbcUrl: jdbc:postgresql://test-host:5432/testdb
  jdbcUsername: test-user
  jdbcPassword: test-password
agentOrchestrator:
  enabled: true
  image:
    repository: example.com/agent-orchestrator
    tag: "42"
  storage:
    bucket: agent-jobs
hunterAgent:
  enabled: true
  image:
    repository: example.com/hunter-agent
    tag: "1"
  networkPolicy:
    enabled: true
remediationAgent:
  enabled: true
  image:
    repository: example.com/remediation-agent
    tag: "1"
  networkPolicy:
    enabled: true
vortexAnalysis:
  enabled: true
  image:
    repository: example.com/vortex
    tag: "1"
  storage:
    bucket: vortex-artifacts
    region: eu-west-1
agenticSigningSecret:
  existingSecret: test-agentic-instance-secret
gvisor:
  enabled: true
istio:
  enabled: true
  meshSidecar:
    enabled: true
  # A real address so this fixture, shared by unrelated tests, doesn't hit the fail-closed
  # "auto with no live cluster" check (validation.yaml); the "auto"/"" behaviours are covered
  # by tests that override this explicitly.
  istiodClusterIP: "10.96.0.42"
