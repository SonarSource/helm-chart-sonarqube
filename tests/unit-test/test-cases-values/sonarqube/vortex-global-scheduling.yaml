community:
  enabled: true
monitoringPasscode: test-passcode
# Global scheduling settings alongside Vortex's own, which take precedence over them.
nodeSelector:
  global: "true"
tolerations:
  - key: global
    operator: Exists
    effect: NoSchedule
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: global
              operator: In
              values: ["true"]
vortex:
  enabled: true
  image:
    repository: example.com/vortex
    tag: "7593"
  sonarqubeToken:
    existingSecret: my-vortex-token
  storage:
    bucket: agent-artifacts
    region: eu-west-1
  nodeSelector:
    vortex: "true"
  tolerations:
    - key: vortex
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: vortex
                operator: In
                values: ["true"]
