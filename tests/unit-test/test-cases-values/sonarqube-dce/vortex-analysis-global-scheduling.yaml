monitoringPasscode: test-passcode
applicationNodes:
  jwtSecret: test-jwt-secret
jdbcOverwrite:
  jdbcUrl: jdbc:postgresql://test-host:5432/testdb
  jdbcUsername: test-user
  jdbcPassword: test-password
# Global scheduling settings alongside the Vortex analysis ones, which they take precedence over.
nodeSelector:
  global: "true"
tolerations:
  - key: global
    operator: Exists
    effect: NoSchedule
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: global
              operator: In
              values: ["true"]
vortexAnalysis:
  enabled: true
  image:
    repository: example.com/a3s/analysis/proxysqs
    tag: "7593"
  sonarqubeToken:
    existingSecret: my-vortex-token
  nodeSelector:
    vortex: "true"
  tolerations:
    - key: vortex
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: vortex
                operator: In
                values: ["true"]
