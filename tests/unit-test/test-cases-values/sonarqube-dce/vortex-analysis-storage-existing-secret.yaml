monitoringPasscode: test-passcode
applicationNodes:
  jwtSecret: test-jwt-secret
jdbcOverwrite:
  jdbcUrl: jdbc:postgresql://test-host:5432/testdb
  jdbcUsername: test-user
  jdbcPassword: test-password
# Both the token and the storage credentials come from existingSecrets, so no chart-managed Secret
# is needed at all.
vortexAnalysis:
  enabled: true
  image:
    repository: example.com/a3s/analysis/proxysqs
    tag: "7593"
  sonarqubeToken:
    existingSecret: my-vortex-token
  storage:
    bucket: agentic-artifacts
    region: eu-west-1
    endpoint: http://minio.speedboat-test-xx.svc:9000
    pathStyleAccess: true
    existingSecret: my-minio-credentials
