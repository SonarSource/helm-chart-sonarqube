monitoringPasscode: test-passcode
applicationNodes:
  jwtSecret: test-jwt-secret
jdbcOverwrite:
  jdbcUrl: jdbc:postgresql://test-host:5432/testdb
  jdbcUsername: test-user
  jdbcPassword: test-password
# Vortex analysis with the token taken from an existing Secret, and its own NetworkPolicy enabled.
vortexAnalysis:
  enabled: true
  image:
    repository: example.com/a3s/analysis/proxysqs
    tag: "7593"
  sonarqubeToken:
    existingSecret: my-vortex-token
    existingSecretKey: TOKEN
  networkPolicy:
    enabled: true
    egressAllow:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: egress-gateway
      - podSelector:
          matchLabels:
            app: proxy
        namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: egress-gateway
        ports:
          - port: 8443
            protocol: TCP
