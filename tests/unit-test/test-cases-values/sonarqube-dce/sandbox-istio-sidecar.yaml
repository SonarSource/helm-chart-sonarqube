monitoringPasscode: test-passcode
applicationNodes:
  jwtSecret: test-jwt-secret
  # Required whenever istio.enabled=true (templates/validation.yaml): Hazelcast allocates the
  # web/CE channels dynamically unless pinned, and Istio only manages ports declared up front.
  webPort: 4023
  cePort: 4024
jdbcOverwrite:
  jdbcUrl: jdbc:postgresql://test-host:5432/testdb
  jdbcUsername: test-user
  jdbcPassword: test-password
agentOrchestrator:
  enabled: true
  image:
    repository: example.com/agent-orchestrator
    tag: "42"
  storage:
    bucket: agent-jobs
hunterAgent:
  enabled: true
  image:
    repository: example.com/hunter-agent
    tag: "1"
  networkPolicy:
    enabled: true
remediationAgent:
  enabled: true
  image:
    repository: example.com/remediation-agent
    tag: "1"
  networkPolicy:
    enabled: true
vortexAnalysis:
  enabled: true
  image:
    repository: example.com/vortex
    tag: "1"
  storage:
    bucket: vortex-artifacts
    region: eu-west-1
agenticSigningSecret:
  existingSecret: test-agentic-instance-secret
gvisor:
  enabled: false
agentRuntimeSandbox:
  enabled: true
  runtimeClassName: kata-mshv-vm-isolation
istio:
  enabled: true
  meshSidecar:
    enabled: true
