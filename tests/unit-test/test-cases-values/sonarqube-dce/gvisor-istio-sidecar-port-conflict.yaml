monitoringPasscode: test-passcode
applicationNodes:
  jwtSecret: test-jwt-secret
  # Required whenever istio.enabled=true (templates/validation.yaml): Hazelcast allocates the
  # web/CE channels dynamically unless pinned, and Istio only manages ports declared up front.
  webPort: 4023
  cePort: 4024
jdbcOverwrite:
  jdbcUrl: jdbc:postgresql://test-host:5432/testdb
  jdbcUsername: test-user
  jdbcPassword: test-password
agentOrchestrator:
  enabled: true
  image:
    repository: example.com/agent-orchestrator
    tag: "42"
  storage:
    bucket: agent-jobs
hunterAgent:
  enabled: true
  image:
    repository: example.com/hunter-agent
    tag: "1"
agenticSigningSecret:
  existingSecret: test-agentic-instance-secret
gvisor:
  enabled: true
istio:
  enabled: true
  # Deliberately equal to hunterAgent.port (default 8090) - must fail closed at render time
  # (sonarqube.agentRuntime.meshSidecar.enabled), not render a silently broken listener.
  meshSidecar:
    enabled: true
    meshPort: 8090
  # A real address so this fixture doesn't also hit the fail-closed "auto with no live
  # cluster" check (validation.yaml), leaving only the meshPort conflict to fail on.
  istiodClusterIP: "10.96.0.42"
