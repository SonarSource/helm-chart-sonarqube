monitoringPasscode: test-passcode
applicationNodes:
  jwtSecret: test-jwt-secret
  image:
    pullSecret: app-node-secret
    pullSecrets:
      - name: app-node-secret-list
jdbcOverwrite:
  jdbcUrl: jdbc:postgresql://test-host:5432/testdb
  jdbcUsername: test-user
  jdbcPassword: test-password
networkPolicy:
  enabled: true
# Vortex analysis enabled, with no Agentic Harness configured.
vortexAnalysis:
  enabled: true
  image:
    repository: example.com/a3s/analysis/proxysqs
    tag: "7593"
    pullSecret: vortex-secret
    pullSecrets:
      - name: vortex-secret-list
  sonarqubeToken:
    token: "squ_example000000000000000000000000000000"
  storage:
    bucket: agentic-artifacts
    region: eu-west-1
  env:
    - name: MY_VAR
      value: my-value
  networkPolicy:
    egressAllow:
      - cidr: 10.0.0.0/8
        ports:
          - port: 443
            protocol: TCP
  nodeSelector:
    vortex: "true"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: vortex
                operator: In
                values: ["true"]
  tolerations:
    - key: vortex
      operator: Exists
      effect: NoSchedule
