monitoringPasscode: test-passcode
applicationNodes:
  jwtSecret: test-jwt-secret
jdbcOverwrite:
  jdbcUrl: jdbc:postgresql://test-host:5432/testdb
  jdbcUsername: test-user
  jdbcPassword: test-password
# Vortex with the token taken from an existing Secret.
vortex:
  enabled: true
  image:
    repository: example.com/vortex
    tag: "7593"
  sonarqubeToken:
    existingSecret: my-vortex-token
    existingSecretKey: TOKEN
  storage:
    bucket: agent-artifacts
    region: eu-west-1
agenticSigningSecret:
  existingSecret: test-agentic-instance-secret
# Vortex needs derived signing keys but no orchestrator, so the key-derivation hook Job gets
# its image here rather than from agentOrchestrator.image.
agentKeyDerivation:
  image:
    repository: example.com/agent-orchestrator
    tag: "42"
