# Vortex with an inline token and NetworkPolicies enabled.
networkPolicy:
  enabled: true

vortex:
  enabled: true
  image:
    repository: example.com/vortex
    tag: "7593"
  sonarqubeToken:
    token: "squ_example000000000000000000000000000000"
  storage:
    bucket: agent-artifacts
    region: eu-west-1
  env:
    - name: MY_VAR
      value: my-value

# Vortex signs its calls to SQS, so it needs the derived keys. The orchestrator is not part of this
# install, so the hook Job gets the image carrying derive-keys.sh explicitly.
agenticSigningSecret:
  existingSecret: agentic-instance-secret

agentKeyDerivation:
  image:
    repository: example.com/agent-orchestrator
    tag: "1.0.0"
