priorityClassName: high-priority

mcp:
  enabled: true
  nodeSelector:
    disktype: ssd
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: env
                operator: In
                values:
                  - mcp
  tolerations:
    - key: "mcp"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: sonarqube-dce-mcp
          release: mcp-scheduling-values.yaml
