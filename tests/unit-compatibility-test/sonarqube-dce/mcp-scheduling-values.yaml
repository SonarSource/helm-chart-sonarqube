# Also proves mcp.nodeSelector/tolerations win over the chart-wide values when set, and that
# mcp.affinity (left unset here) falls back to the chart-wide .Values.affinity.
priorityClassName: high-priority

nodeSelector:
  global: "true"
tolerations:
  - key: "global"
    operator: "Exists"
    effect: "NoSchedule"
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: env
              operator: In
              values:
                - global

mcp:
  enabled: true
  nodeSelector:
    disktype: ssd
  tolerations:
    - key: "mcp"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: sonarqube-dce-mcp
          release: mcp-scheduling-values.yaml
