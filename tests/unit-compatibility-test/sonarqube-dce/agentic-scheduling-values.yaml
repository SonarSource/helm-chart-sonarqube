# Exercises scheduling configuration (nodeSelector, affinity, tolerations, topologySpreadConstraints
# and the chart-wide priorityClassName) for the Agentic Harness pods: Vortex, the Hunter Agent and
# the Remediation Agent runtimes, and the Agent Orchestrator.
community:
  enabled: true

jdbcOverwrite:
  enabled: true

priorityClassName: high-priority

agenticSigningSecret:
  existingSecret: agentic-instance-secret

vortex:
  enabled: true
  image:
    repository: example.com/vortex
    tag: "1.0.0"
  storage:
    bucket: agent-artifacts
    region: eu-west-1
  nodeSelector:
    disktype: ssd
  tolerations:
    - key: "agentic"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: env
                operator: In
                values:
                  - agentic
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: sonarqube-dce-vortex
          release: agentic-scheduling-values.yaml

agentOrchestrator:
  enabled: true
  image:
    repository: example.com/agent-orchestrator
    tag: "1.0.0"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          sonarqube.agent/component: orchestrator

hunterAgent:
  enabled: true
  image:
    repository: example.com/hunter-agent
    tag: "1.0.0"
  nodeSelector:
    disktype: ssd
  tolerations:
    - key: "agentic"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: env
                operator: In
                values:
                  - agentic
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: sonarqube-dce-agent-runtime-hunter
          release: agentic-scheduling-values.yaml

remediationAgent:
  enabled: true
  image:
    repository: example.com/remediation-agent
    tag: "1.0.0"
  nodeSelector:
    disktype: ssd
  tolerations:
    - key: "agentic"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: env
                operator: In
                values:
                  - agentic
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: sonarqube-dce-agent-runtime-remediation
          release: agentic-scheduling-values.yaml
