# Vortex analysis with an inline token and NetworkPolicies enabled.
networkPolicy:
  enabled: true

vortexAnalysis:
  enabled: true
  image:
    repository: example.com/a3s/analysis/proxysqs
    tag: "7593"
  sonarqubeToken:
    token: "squ_example000000000000000000000000000000"
  env:
    - name: MY_VAR
      value: my-value
  networkPolicy:
    egressAllow:
      - cidr: 10.0.0.0/8
        ports:
          - port: 443
            protocol: TCP
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: egress-gateway
