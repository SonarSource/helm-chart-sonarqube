# Exercises the Agent Orchestrator (Deployment/Service/Secret), the Remediation Agent
# (Deployment/Service), dedicated ServiceAccounts (IRSA annotations), the remediation
# NetworkPolicy (egress restricted to the Agent Egress Proxy), the Agent Egress Proxy
# (ConfigMap/Service/Deployment/PDB/NetworkPolicy with allowedDomains), credential-less S3
# storage (no static keys), and the gVisor RuntimeClass wired onto the runtime.
community:
  enabled: true

networkPolicy:
  enabled: true

jdbcOverwrite:
  enabled: true

agentOrchestrator:
  enabled: true
  image:
    repository: example.com/agent-orchestrator
    tag: "1.0.0"
  port: 8080
  serviceAccount:
    create: true
    automountToken: true
    name: agent-orchestrator
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/approles/agent-orchestrator
  # CORE DB password decoupled from SonarQube's jdbc secret (e.g. an encrypted value the
  # orchestrator can't use); endpoint/name/username fall back to jdbcOverwrite.
  coreDb:
    passwordSecretName: core-db
    passwordSecretKey: password
  # Credential-less storage: no accessKey/secretKey -> the orchestrator omits the static-key env
  # and relies on the pod IAM identity (IRSA).
  storage:
    endpoint: ""
    region: eu-west-1
    bucket: agent-artifacts
    pathStyle: false
  sonarqubeToken:
    token: "squ_example000000000000000000000000000000"

remediationAgent:
  enabled: true
  networkPolicy:
    enabled: true
  serviceAccount:
    create: true
    automountToken: true
    name: remediation-agent-runtime
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/approles/agent-orchestrator
  image:
    repository: example.com/remediation-agent
    tag: "1.0.0"

agentEgressProxy:
  allowedDomains:
    - .anthropic.com
  networkPolicy:
    enabled: true

# The instance secret the key-derivation hook derives the per-hop signing keys from. Required
# whenever an agentic component that signs or verifies is enabled; derive-keys.sh comes from the
# orchestrator image, which this case already sets.
agenticSigningSecret:
  existingSecret: agentic-instance-secret

vortex:
  enabled: true
  image:
    repository: example.com/vortex
    tag: "1"
  sonarqubeToken:
    token: "squ_example000000000000000000000000000000"
  storage:
    bucket: vortex-artifacts
    region: eu-west-1

gvisor:
  enabled: true
