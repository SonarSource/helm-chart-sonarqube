apiVersion: batch/v1
kind: Job
metadata:
  name: vortex-values.yaml-sonarqube-dce-agent-key-derivation
  labels:
    app: sonarqube-dce
    chart: sonarqube-dce-2026.5.0
    release: vortex-values.yaml
    heritage: Helm
    sonarqube.agent/component: key-derivation
    app.kubernetes.io/component: agent-key-derivation
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      name: vortex-values.yaml-sonarqube-dce-agent-key-derivation
      labels:
        app: sonarqube-dce
        release: vortex-values.yaml
        sonarqube.agent/component: key-derivation
        app.kubernetes.io/component: agent-key-derivation
      annotations:
        # The hook Job talks to the Kubernetes API and then exits; an Istio sidecar would keep the
        # pod running forever and the hook would never be seen to succeed.
        "sidecar.istio.io/inject": "false"
    spec:
      restartPolicy: OnFailure
      # The script authenticates to the API with the projected token, so force the mount here
      # rather than inheriting it: with serviceAccount.create=false the Job runs under the
      # release's top-level ServiceAccount, whose automountToken defaults to false - the `cat` of
      # the token would fail under `set -eu` and take the whole release down with it.
      automountServiceAccountToken: true
      serviceAccountName: vortex-values.yaml-sonarqube-dce-agent-key-derivation
      containers:
        - name: derive-keys
          image: "example.com/agent-orchestrator:1.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 900
            runAsNonRoot: true
            runAsUser: 900
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 250m
              ephemeral-storage: 64Mi
              memory: 128Mi
            requests:
              cpu: 50m
              ephemeral-storage: 32Mi
              memory: 64Mi
          env:
            - name: TMPDIR
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              SECRET_FILE=/etc/agentic/instance-secret/instance-secret
              KEYS=$(mktemp -d)
              RESP=$(mktemp)
              BODY_FILE=$(mktemp)
              CFG_FILE=$(mktemp)

              # Derive every label any enabled consumer needs, in one pass. derive-keys.sh is
              # deterministic, so re-running it on upgrade reproduces the same keys - an upgrade
              # that doesn't change agenticSigningSecret rewrites the Secrets byte-identically and
              # therefore doesn't churn the consumer pods.
              /derive-keys.sh --secret-file "$SECRET_FILE" \
                --label agentic-shared="$KEYS/agentic-shared" \
                --mode 0444

              API=https://kubernetes.default.svc
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN=$(cat "$SA/token")
              NS=$(cat "$SA/namespace")

              # Upsert: PUT first (the common case is an upgrade over an existing Secret), fall
              # back to POST when it isn't there yet. Any other status is fatal - notably 403,
              # which means the Role didn't apply and silently continuing would leave the
              # consumers mounting nothing.
              #
              # Method/URL are passed as argv (no secret material there); the token and body go
              # through a curl config file instead of -H/--data, since curl's own argv is readable
              # by anything with host /proc access via /proc/<pid>/cmdline for as long as the
              # request is in flight. printf is a shell builtin here (no execve, so its arguments
              # never appear in any process's /proc/<pid>/cmdline either).
              api_write() {
                printf '%s' "$3" > "$BODY_FILE"
                {
                  printf 'cacert = "%s/ca.crt"\n' "$SA"
                  printf 'header = "Authorization: Bearer %s"\n' "$TOKEN"
                  printf 'header = "Content-Type: application/json"\n'
                  printf 'data-binary = "@%s"\n' "$BODY_FILE"
                } > "$CFG_FILE"
                curl -sS -o "$RESP" -w '%{http_code}' -X "$1" "$2" -K "$CFG_FILE"
              }

              write_secret() {
                name=$1
                shift
                data=""
                for label in "$@"; do
                  # Derived keys are lowercase hex, so no JSON escaping is needed here.
                  value=$(cat "$KEYS/$label")
                  # Not `[ -n "$data" ] && ...`: under set -e a false test as the last command of
                  # a loop body is an exit in some shells.
                  if [ -n "$data" ]; then data="$data,"; fi
                  data="$data\"$label\":\"$value\""
                done
                body="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"type\":\"Opaque\",\"metadata\":{\"name\":\"$name\",\"labels\":{\"app.kubernetes.io/managed-by\":\"Helm\",\"app.kubernetes.io/component\":\"agent-key-derivation\",\"release\":\"vortex-values.yaml\"}},\"stringData\":{$data}}"

                code=$(api_write PUT "$API/api/v1/namespaces/$NS/secrets/$name" "$body")
                if [ "$code" = "404" ]; then
                  code=$(api_write POST "$API/api/v1/namespaces/$NS/secrets" "$body")
                fi
                case "$code" in
                  200|201)
                    echo "wrote Secret $name ($*)"
                    ;;
                  *)
                    echo "FATAL: writing Secret $name failed with HTTP $code" >&2
                    cat "$RESP" >&2
                    exit 1
                    ;;
                esac
              }
              write_secret vortex-values.yaml-sonarqube-dce-agentic-keys-sqs agentic-shared
              write_secret vortex-values.yaml-sonarqube-dce-agentic-keys-vortex agentic-shared
          volumeMounts:
            - name: instance-secret
              mountPath: /etc/agentic/instance-secret
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: instance-secret
          secret:
            secretName: agentic-instance-secret
            items:
              - key: instance-secret
                path: instance-secret
        - name: tmp
          emptyDir: {}
