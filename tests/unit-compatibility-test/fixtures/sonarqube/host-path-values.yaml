# Source: sonarqube/templates/agentic-gvisor.yaml
# The installer patches a label onto its own Node so the RuntimeClass scheduler only admits runtime
# pods once runsc is actually ready there. RBAC has no "own node only" scoping primitive, so this
# grant is cluster-scoped: any pod using this ServiceAccount can get/patch ANY node, not just the
# one it runs on. Accepted trust surface for this deliberately privileged, host-mutating installer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: host-path-values.yaml-sonarqube-agentic-gvisor-installer
  labels:
    app: sonarqube
    chart: sonarqube-2026.5.0
    release: host-path-values.yaml
    heritage: Helm
    app.kubernetes.io/component: agentic-gvisor
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
# Source: sonarqube/templates/agentic-gvisor.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: host-path-values.yaml-sonarqube-agentic-gvisor-installer
  labels:
    app: sonarqube
    chart: sonarqube-2026.5.0
    release: host-path-values.yaml
    heritage: Helm
    app.kubernetes.io/component: agentic-gvisor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: host-path-values.yaml-sonarqube-agentic-gvisor-installer
subjects:
  - kind: ServiceAccount
    name: host-path-values.yaml-sonarqube-agentic-gvisor-installer
    namespace: default
---
# Source: sonarqube/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: host-path-values.yaml-sonarqube
  labels:
    app: sonarqube
    chart: sonarqube-2026.5.0
    release: host-path-values.yaml
    heritage: Helm
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: sonarqube
    release: host-path-values.yaml
---
# Source: sonarqube/templates/agentic-gvisor.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: host-path-values.yaml-sonarqube-agentic-gvisor-installer
  labels:
    app: sonarqube
    chart: sonarqube-2026.5.0
    release: host-path-values.yaml
    heritage: Helm
    app.kubernetes.io/component: agentic-gvisor
spec:
  selector:
    matchLabels:
      app: sonarqube-agentic-gvisor-installer
      release: host-path-values.yaml
  template:
    metadata:
      labels:
        app: sonarqube-agentic-gvisor-installer
        release: host-path-values.yaml
    spec:
      # Needed so `nsenter -t 1` can reach the host's systemd to restart containerd; chroot alone
      # cannot reach the host systemd bus.
      hostPID: true
      serviceAccountName: host-path-values.yaml-sonarqube-agentic-gvisor-installer
      tolerations:
        - operator: Exists
      containers:
        - name: gvisor-installer
          image: debian@sha256:1710bde34461551a19a47c787885ec9ad7058d9a5bead2affb8d088fa2f8502b
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/run.sh"]
          # Privileged by design: mounts the host filesystem to install runsc and restart containerd.
          # The deliberate trust-tier exception called out in values.yaml — not hardened like the runtimes.
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: scripts
              mountPath: /scripts
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: scripts
          configMap:
            name: host-path-values.yaml-sonarqube-agentic-gvisor-installer
            defaultMode: 0755
