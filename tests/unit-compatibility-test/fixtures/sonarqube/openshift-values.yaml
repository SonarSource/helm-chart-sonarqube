# Source: sonarqube/templates/sonarqube-sts.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openshift-values.yaml-sonarqube
  labels:
    app: sonarqube
    chart: sonarqube-2026.5.0
    release: openshift-values.yaml
    heritage: Helm
    app.kubernetes.io/name: openshift-values.yaml
    app.kubernetes.io/instance: openshift-values.yaml
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: sonarqube
    app.kubernetes.io/component: openshift-values.yaml-sonarqube
    app.kubernetes.io/version: "2026.4.0-enterprise"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  serviceName: openshift-values.yaml-sonarqube
  selector:
    matchLabels:
      app: sonarqube
      release: openshift-values.yaml
  template:
    metadata:
      annotations:
        checksum/config: 1d06088e9635fdf05d369dd3db97f03fcf63e74050aff2406b77b1cbd547b190
        checksum/plugins: ab1192b90b6d8c01eaec3bc3820d809a5c8f1869053fe43a5f511ae7c2de95ab
        checksum/secret: e0ef94699d981eb794efd56566572ba4e96186c655197fc48fa1d4abe998b8f2
      labels:
        app: sonarqube
        release: openshift-values.yaml
    spec:
      automountServiceAccountToken: false
      securityContext:
        {}
      initContainers:
      containers:
        - name: sonarqube
          image: sonarqube:2026.4.0-enterprise
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          resources:
            limits:
              cpu: 800m
              ephemeral-storage: 512000M
              memory: 6144M
            requests:
              cpu: 400m
              ephemeral-storage: 1536M
              memory: 2048M
          env:
            - name: SONAR_HELM_CHART_VERSION
              value: 2026.5.0
            - name: IS_HELM_OPENSHIFT_ENABLED
              value: "true"
            - name: SONAR_WEB_SYSTEMPASSCODE
              valueFrom:
                secretKeyRef:
                  name: openshift-values.yaml-sonarqube-monitoring-passcode
                  key: SONAR_WEB_SYSTEMPASSCODE
            - name: SONAR_MCP_ENABLED
              value: "true"
            - name: SONAR_MCP_SERVERURL
              value: "http://openshift-values.yaml-sonarqube-mcp:8080"
            - name: SONAR_WEB_CONTEXT
              value: /
            - name: SONAR_WEB_JAVAOPTS
              value: ""
            - name: SONAR_CE_JAVAOPTS
              value: ""
          envFrom:
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - |
                curl --noproxy "*" -fsS -o /dev/null --max-time 1 -H "X-Sonar-Passcode: $SONAR_WEB_SYSTEMPASSCODE" "http://localhost:9000/api/system/liveness"
            failureThreshold: 6
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 1
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - |
                #!/bin/bash
                # A Sonarqube container is considered ready if the status is UP, DB_MIGRATION_NEEDED or DB_MIGRATION_RUNNING
                # status about migration are added to prevent the node to be kill while SonarQube is upgrading the database.
                if curl --noproxy "*" -s http://localhost:9000/api/system/status | grep -q -e '"status":"UP"' -e '"status":"DB_MIGRATION_NEEDED"' -e '"status":"DB_MIGRATION_RUNNING"'; then
                  exit 0
                fi
                exit 1
            failureThreshold: 6
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 1
          startupProbe:
            httpGet:
              scheme: HTTP
              path: /api/system/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 24
            timeoutSeconds: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /opt/sonarqube/data
              name: sonarqube
              subPath: data
            - mountPath: /opt/sonarqube/temp
              name: sonarqube
              subPath: temp
            - mountPath: /opt/sonarqube/logs
              name: sonarqube
              subPath: logs
            - mountPath: /tmp
              name: tmp-dir
            - mountPath: /opt/sonarqube/extensions
              name: sonarqube
              subPath: extensions
      serviceAccountName: default
      volumes:
        
        - name: sonarqube
          emptyDir:
            {}
        - name : tmp-dir
          emptyDir:
            {}
