# Source: sonarqube/templates/agent-egress-proxy-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: remediation-agent-values.yaml-sonarqube-agent-egress-proxy
  labels:
    app: sonarqube
    chart: sonarqube-2026.5.0
    release: remediation-agent-values.yaml
    heritage: Helm
    sonarqube.agent/component: egress-proxy
    app.kubernetes.io/component: agent-egress-proxy
data:
  squid.conf: |-
    http_port 3128

    # Pass-through forward proxy, not a cache - nothing is stored or re-served.
    cache deny all
    # Squid's default cache_mem is 256 MB even with caching denied above - the pool still holds
    # in-transit objects - so pin it well under agentEgressProxy.resources' memory limit or the
    # container gets OOMKilled under concurrent agent traffic.
    cache_mem 16 MB
    via off
    forwarded_for delete

    access_log stdio:/dev/stdout squid
    cache_log stdio:/dev/stderr

    # Must be set explicitly, or Squid FATALs on startup instead of falling back to a default.
    cache_effective_user proxy proxy

    # No request_body_max_size: without TLS interception a CONNECT tunnel is opaque to Squid, so
    # any such cap would miss every HTTPS body (all LLM prompts and uploads) and apply only to
    # cleartext - which here means SonarQube's own always-reachable endpoints. A limit there would
    # be a silent ceiling on a path the chart guarantees, so body size is left to SonarQube.

    acl SSL_ports port 443
    acl Safe_ports port 80
    acl Safe_ports port 443
    # SonarQube's own port, so the hardcoded allow rule below can ever match.
    acl Safe_ports port 9000
    # The chart itself points the remediation runtime at the orchestrator
    # (REMEDIATION_RULE_INFO_ENDPOINT), so it must always be reachable, like sonarqube_host.
    acl Safe_ports port 8080
    # To reach an endpoint on another port, append to these ACLs from extraSquidConf - Squid
    # resolves http_access rules to the named ACL object, so entries added there still apply to
    # the `deny !Safe_ports` rule below despite being spliced in after it. Whatever port you add
    # must ALSO be in agentEgressProxy.networkPolicy.egressPorts, or NetworkPolicy drops the
    # request before Squid ever sees it.
    acl CONNECT method CONNECT

    # No TLS interception (SSL-bump): CONNECT tunnels are passed through as-is, so dstdomain below
    # matches the CONNECT request's target hostname, not a decrypted SNI/certificate.
    # Rendered only when non-empty: a valueless `acl ... dstdomain` makes Squid log
    # "WARNING: empty ACL" on every start, and the allow rule referencing it can never match.
    acl allowed_domains dstdomain .anthropic.com

    # SonarQube's own rule-lookup and agentic-analysis endpoints must always be reachable, no
    # matter what allowedDomains contains - hardcoded here (not sourced from Values) so it can't
    # be edited away. The path match is anchored to the SonarQube service itself via
    # sonarqube_host; the regexes are suffix-based (not tied to webcontext/API-version prefixes)
    # so they keep matching regardless of how those are configured. Fully qualified (not the bare
    # short name) since Squid's DNS resolver doesn't honour /etc/resolv.conf's search list.
    # urlpath_regex matches the path *and* query string, so both endpoints must tolerate a
    # trailing "?..." - real calls to rules/show carry a "?key=..." query parameter. Anchored
    # with ^ because of that same query-string matching: an unanchored pattern would match
    # `/anything?x=/rules/show` and reopen the whole API surface.
    acl sonarqube_host dstdomain remediation-agent-values.yaml-sonarqube.default.svc.cluster.local
    acl sonarqube_agentic_endpoints urlpath_regex ^/rules/show(\?|$) ^/agentic-analysis(/|\?|$)
    # The orchestrator, for the same reason as sonarqube_host above - scoped to the one path the
    # remediation runtime actually calls (REMEDIATION_RULE_INFO_ENDPOINT), not the whole
    # orchestrator API surface, the same way sonarqube_agentic_endpoints scopes sonarqube_host.
    acl orchestrator_host dstdomain remediation-agent-values.yaml-sonarqube-agent-orchestrator.default.svc.cluster.local
    acl orchestrator_agentic_endpoints urlpath_regex ^/remediation-agent/rule-info(\?|$)

    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports
    http_access allow sonarqube_host sonarqube_agentic_endpoints
    http_access allow orchestrator_host orchestrator_agentic_endpoints
    http_access allow allowed_domains
    http_access deny all
