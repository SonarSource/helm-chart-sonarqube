# Source: sonarqube/templates/gvisor.yaml
# gVisor (runsc) sandboxing for the agent runtimes. gvisor.enabled renders the RuntimeClass
# below, assuming runsc is installed out-of-band. gvisor.installer.enabled additionally renders a
# privileged, host-mutating DaemonSet that installs it — a deliberately different trust tier from
# the hardened runtimes; self-managed nodes only. See values.yaml for details.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app: sonarqube
    chart: sonarqube-2026.5.0
    release: remediation-agent-values.yaml
    heritage: Helm
    app.kubernetes.io/component: gvisor
handler: runsc
scheduling:
  nodeSelector:
    gvisor.enabled: "true"
---
